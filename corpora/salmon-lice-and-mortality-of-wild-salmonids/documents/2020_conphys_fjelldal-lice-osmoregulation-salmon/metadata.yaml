rag_summary: >
  This study investigates the effects of salmon louse infection on osmoregulation, growth, and survival in Atlantic salmon under laboratory conditions. It provides threshold values for physiological stress responses, showing that infection intensities above 0.2 lice g−1 lead to significant osmoregulatory impairment and mortality. The findings support the need for monitoring and conservation efforts in regions with high lice infestation levels.
