rag_summary: >
  This critical review evaluates the Norwegian Traffic Light System (TLS) for managing salmon lice impacts on wild Atlantic salmon. It critiques the TLS's assumptions about smolt migration timing and lice larvae production, suggesting these lead to overestimated infection pressures and mortality. The review calls for improvements in the TLS's accuracy and reliability.
