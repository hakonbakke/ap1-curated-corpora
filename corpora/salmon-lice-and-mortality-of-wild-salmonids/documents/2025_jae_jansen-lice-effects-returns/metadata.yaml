rag_summary: >
  The study by Jansen et al. (2025) examines the impact of salmon lice from aquaculture on the numbers and size distributions of Atlantic salmon returning to Norwegian rivers. Using a statistical regression model, the study finds that lice significantly reduce the returns of one-sea-winter salmon and alter the size distribution of returning populations. The study supports the view that lice from farms negatively impact wild salmonids, with implications for aquaculture management.
