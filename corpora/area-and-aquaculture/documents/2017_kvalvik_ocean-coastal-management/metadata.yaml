key_claims:
- Nine inter-municipal coastal zone planning processes in six counties, involving
  65 municipalities, had been conducted up to October 2016. Production took place
  in 170 of 276 coastal municipalities. About half of municipal coastal plans were
  recently revised or being revised, several in inter-municipal processes.
- Municipalities designate aquaculture area under the Planning and Building Act. Each
  municipal council keeps the final planning decision for its area. Seven of nine
  boards were delegated process authority. Helgeland and Tromsø were not, and planning
  there took place more in the single municipalities.
- All nine processes showed a high degree of policy cooperation (dialogue and information
  exchange) and a high degree of policy coordination (joint project organisation,
  shared information gathering, similar planning tools).
- Full coordination of content, including designation of aquaculture area across the
  whole sea area, was found in four processes with few municipalities (Lyngenfjord,
  Fensfjord, Romsdalsfjord, Nord-Troms), 15 of the 65 municipalities. Fensfjord jointly
  chose not to designate new aquaculture area (shipping and preparedness first), which
  the authors say reduces the count with aquaculture clarification to 10 municipalities.
- In the remaining processes, designation of new aquaculture area often fell back
  to each municipality. Sør-Trøndelag produced regional guidelines rather than a joint
  plan map and set all areas shallower than 25 m as non-aquaculture. Helgeland used
  inverse planning. Nordmøre jointly protected salmon-river areas and mapped no-transport
  and no-fishing buffers that crossed municipal borders, but still designated new
  aquaculture area municipality by municipality. The Tromsø region collected a joint
  wish list but did not coordinate the map. On a shared fjord with a national salmon
  fjord, Tromsø designated no aquaculture while South and Mid Troms designated the
  south side.
- The authors conclude that inter-municipal planning remedies only some of the piece-by-piece
  problem, but is still a better tool than single-municipality planning and a first
  step toward more integrated coastal planning. They report more level-three integration
  than they had expected. Only Fensfjorden had established formal post-plan cooperation
  procedures in this set.
- Occupied aquaculture area including safety and anchoring is stated as 0.5 percent
  of coastal area inside the baseline. Site numbers fell from about 1800 in 2000 to
  about 1000, while production per site rose from 278 to 1303 tonnes. Production more
  than doubled from 600 000 tonnes in 2000 to more than 1.2 million tonnes in 2014.
  Food Safety Authority distances are generally 2.5 km between farms and 5 km to a
  slaughtery. MTB is stated as 945 tons in Finnmark and Troms and 780 tons further
  south. The last four years before the paper there had been no production growth.
claims_about_uncertainty:
- How much coordination will occur in day-to-day management after adoption is unknown.
- Whether municipalities will revise plans together or alone remains to be seen.
- Navy sequestration of exercise areas halted or constrained several processes, including
  Sør-Trøndelag.
- Helgeland, as of October 2016, had been stopped at county level after sector protests.
  The Directorate of Fisheries supported the inverse strategy.
claims_about_policy_or_management:
- The 2009 Planning and Building Act invites inter-municipal cooperation, but does
  not take away municipal final say.
- County councils often initiated, funded or facilitated processes. Troms ran a three-year
  county project (Kystplan Troms, 2013-2016) supporting 24 municipalities in three
  inter-municipal plans.
- Larger merged municipalities may reduce the number of units that must coordinate.
- Cooperation is described as win-win for shared data and tools, not for designating
  aquaculture area, because both pollution costs and economic gains are local.
methodological_limitations:
- Qualitative document study plus interviews with process leaders, not a survey of
  all municipal councils. Integration levels rest on the authors' coding of nine processes.
- Figures 1 and 2 and Table 3 colour cells are image placeholders or layout artefacts
  in this extract and were not read as data.
rag_summary: 'Kvalvik and Robertsen (2017) ask whether inter-municipal coastal zone
  planning in Norway improves coordination, especially designation of aquaculture
  area. Methods are documents from all nine processes up to October 2016, interviews
  with process leaders, and observation at regional meetings. They find strong sharing
  of information, tools and process, but uneven coordination of content. Only four
  small processes produced fully joint designation across a fjord or sea area. Fensfjord
  jointly chose not to add aquaculture. Municipal councils still adopt the plan for
  their own area. The paper treats inter-municipal planning as a partial remedy for
  piece-by-piece municipal plans, not a substitute for national institutional coordination.

  '
