key_claims:
- Norwegian salmon aquaculture faces socio-ecological challenges, including fish escapes
  and lice infestations.
- Informal, self-organized networks contribute to sustainability by fostering mutual
  learning and adaptability.
- Horizontal networks excel in knowledge sharing and collective action, addressing
  biological risks and economic challenges.
- Vertical networks emphasize public-private collaboration but show limited engagement
  with environmental sustainability.
- Adaptive co-management principles highlight the importance of trust, local knowledge,
  and iterative adaptation.
- Regulatory constraints and relational dependencies pose challenges to proactive
  environmental collaboration.
- The study underscores the complementary strengths of horizontal and vertical networks
  in enhancing resilience and sustainability.
claims_about_uncertainty:
- Regulatory constraints and relational dependencies pose challenges to proactive
  environmental collaboration.
claims_about_policy_or_management:
- Informal governance systems can enhance resilience and sustainability in aquaculture.
- Horizontal networks enable stakeholders to address biological risks, regulatory
  pressures, and economic challenges.
- Vertical networks drive community and economic development through public-private
  collaboration.
methodological_limitations:
- Focus on two regions in Arctic Norway may constrain applicability to other contexts.
rag_summary: This study examines the role of informal, self-organized networks in
  Norwegian aquaculture, focusing on horizontal collaborations among salmon entrepreneurs
  and vertical collaborations between companies and municipalities. It highlights
  how these networks contribute to sustainability by fostering mutual learning, adaptability,
  and resilience. Horizontal networks excel in knowledge sharing and collective action,
  addressing biological risks and economic challenges. Vertical networks emphasize
  public-private collaboration, driving community and economic development, but show
  limited engagement with environmental sustainability. The study underscores the
  complementary strengths of these networks and their role in enhancing resilience
  and sustainability in aquaculture. However, regulatory constraints and relational
  dependencies pose challenges to proactive environmental collaboration.
