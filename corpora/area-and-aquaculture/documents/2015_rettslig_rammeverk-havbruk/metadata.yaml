key_claims:
- First report from FHF project 900902 on impacts of the legal framework and possible
  simplification. Nofima report 29/2015, dated 12 June 2015, 57 pages. The extract
  maps the administrative set-up, main statutes, licences and local spatial plans,
  and names obstacles.
- The system is described as sectorised, fragmented and complex. Aquaculture Act section
  6 gives the Food Safety Authority, pollution authority, Coastal Administration and
  (for freshwater) NVE an effective veto on site clearance. Section 15 lets municipalities
  close sea area through plans.
- 'Two governance systems meet: instrumental state sector administration (for example
  lice rules) and negotiated municipal area planning. Poor fit between them is named
  as a barrier to better site use and site structure. After the 2010 reform, locality
  decisions sit with the counties. The Trøndelag model (2002-2009) that transferred
  decision authority to the Fisheries Directorate is said not to have been repeated.'
- No authority is assigned to make an overall weighing of interests for and against
  a site. A refusal on one sector ground can stop a site even if a joint view would
  allow it. County governors' nature advice under the Nature Diversity Act is not
  a veto. How often counties follow that advice is left unknown.
- Impact-assessment rules do not require inclusion of aquaculture's positive effects.
  Relevant aquaculture KU guidance is described as missing. The 2015 KU revision is
  said to drop the old 3 600 MTB size trigger and to follow EU influence rather than
  farm size. Small pen or site adjustments still require a full site application
  (often 75 to 150 pages).
- Municipalities can close sea area to aquaculture through plans. Many municipalities
  have been reluctant to free more area, citing low local return. NFKK has pressed
  for a production or area fee. Government instead steered parts of new-licence fees
  to counties (2009) or host municipalities (2013-2014).
- 'Green licences in 2014 are stated to send 480 million kroner to municipalities
  (15 auctioned at 55-65 million, 30 at 10 million). The 45 licences are estimated
  at about 55 000 tonnes, or about 5 percent of 2014 production. The authors list
  weaknesses of one-off fee shares: irregular rounds, no payment for existing sites,
  problems for fire-break municipalities, and room for hidden bargaining.'
- 'Hersoug et al. (2014) are cited: 87 percent of farmers agreed that a fixed annual
  municipal payment would ease access to new area. A company survey in this report
  says 63 percent agree that access to deep, well-flushed, sheltered sites is the
  main challenge, and 37 percent name area access as the largest growth constraint.'
- Physical occupation including moorings is given as 420 km2, or less than five per
  thousand of the area inside the baseline (Andreassen et al., 2010). Approved sites
  fell from 1 806 in 2000 to 946 in 2015, with about 550 to 600 in use. Sites above
  3 600 MTB rose from 2 percent in 2006 to 30 percent in January 2015. Recommended
  Food Safety Authority distances are 2.5 km, or 5 km firebreaks, from guidance rather
  than statute.
- The 2015 white-paper traffic-light proposal is described as still unresolved, earliest
  2017. If licence MTB grows, locality MTB may become the binding limit. Directorate
  of Fisheries is quoted as saying production areas would be hard to run with today's
  fragmented administration.
claims_about_uncertainty:
- Severity and cost of negative externalities are stated as debated. The report does
  not estimate those costs. Optimal regulation is said not to mean zero escapees.
- How much informal county coordination changes decisions is not measured. Effects
  of more or less political involvement inside counties are described as little known.
  County aquaculture units are said to have one to three officers.
- National salmon-fjord practice is illustrated with a Tromsø-region plan that used
  proximity to salmon fjords to refuse aquaculture zones, and a SalMar North comment
  that the legal zone does not support extra limits outside it. Systematic practice
  is left to later project reports.
claims_about_policy_or_management:
- A more coordinated structure should be considered, including other coastal users.
  Sustainability focus is judged too narrow (few environmental parameters, weak social
  and economic sustainability). The authors ask whether other resource industries
  face the same tests.
- The authors sketch an objection-like path to the Ministry of Trade, Industry and
  Fisheries when a party wants an overall review after a sector refusal.
- Simplification of small site adjustments is proposed, for example clearing a given
  area inside which the farmer chooses exact placement.
- 'State guidelines that override municipal sea-area rights are judged politically
  unlikely. Inter-municipal coastal planning is reported in 65 municipalities across
  five counties (Robertsen et al., 2014). End-2012 figures: 12 coastal municipalities
  still lacked an approved coastal-zone plan.'
methodological_limitations:
- Literature and legal-document study plus an industry reference group. No new statistical
  measurement of processing times or refusal rates in the extract pages used.
- Chapter 4 is a framework for static and dynamic costs of regulation, not a measured
  cost account.
- This is the first of three work packages. Practice and conflict packages were still
  to come.
rag_summary: 'Solås, Hersoug, Andreassen, Tveterås, Osmundsen, Sørgård, Karlsen, Asche
  and Robertsen (Nofima report 29/2015) map the legal and administrative framework
  for Norwegian aquaculture. Methods are statutes, preparatory works, guidance, reports
  and an industry reference group. They find a sectorised system with multiple vetoes
  on sites, a split between state sector control and municipal area planning, no overall
  weighing of interests, thin impact-assessment guidance, and municipal reluctance
  tied to weak local return. One-off shares of licence fees (480 million kroner from
  the 2014 green licences) are judged a poor substitute for a regular municipal payment.
  Physical farm area is given as under five per thousand of inshore sea. The report
  is a status map, not a completed simplification package.

  '
