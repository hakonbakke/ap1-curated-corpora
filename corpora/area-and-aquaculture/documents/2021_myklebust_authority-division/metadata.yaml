key_claims:
- 'The chapter asks whether the legal basis for governing sea use, in regulations and conditions, is interpreted differently inside and outside private property, and whether giving more weight to coordination between authorities conflicts with equality and predictable decisions.'
- 'Plan- og bygningsloven is treated as the tool for steering nearshore sea, one nautical mile beyond the baselines, and the chapter sets it against the Aquaculture Act and the split between municipal competence and state or county licence competence.'
- 'The text cites a government aim of a fivefold increase in salmon and trout production by 2050, and says traditional pens are poorly suited to offshore sites, so the contest over nearshore sea continues while capacity remains there.'
- 'It states that the Storting decided in 2015 to establish the aquaculture fund, and that in 2016-2019 80 percent of the fee from increased production capacity was distributed to municipalities and counties that had opened for farming in their plans. The chapter calls this a strong incentive to prioritise aquaculture in municipal planning.'
- 'Examples of municipal conditions include the 2016 Lenvik objection on genetic introgression and salmon lice, including a possible closed-pen requirement, and the 2017 Osterøy plan text requiring minimal or no organic particle discharge.'
claims_about_uncertainty: []
claims_about_policy_or_management:
- 'The chapter asks where the legal limit sits on a municipality setting operating conditions for nearshore aquaculture, and how steering should fit aquaculture to other uses.'
methodological_limitations:
- 'Legal analysis of statutes, objections and plan decisions. Not an empirical study of how often such conditions are used or of their effect on growth.'
rag_summary: >
  Myklebust (2021) is chapter 17 in Hauge and Stokke, Integrert kystsoneforvaltning
  (Universitetsforlaget). It examines the legal split between planning authorities and
  aquaculture authorities when sea area is steered. The chapter asks whether powers
  in regulations and conditions are read differently inside and outside private
  property, and whether extra weight on coordination conflicts with equal treatment
  and predictable decisions. It places the Planning and Building Act, out to one
  nautical mile beyond the baselines, against the Aquaculture Act. It cites the aim
  of a fivefold production increase by 2050, argues that conventional pens are poorly
  suited offshore, and says the nearshore contest continues. It reports that the
  aquaculture fund was decided in 2015 and that in 2016-2019 80 percent of the fee
  for increased capacity went to municipalities and counties that opened sea in their
  plans. Lenvik (2016) and Osterøy (2017) are used as cases where municipalities
  tried to set operating conditions, including closed pens and limits on organic discharge.
