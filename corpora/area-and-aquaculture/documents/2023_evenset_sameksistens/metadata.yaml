consensus_signal: moderate_agreement
quality_signal: strong
quality_rationale: >
  Named QSR protocol, bilingual summaries, PRISMA-style counts per stressor, and a
  clear limit that QSR is not a full systematic review and does not grade paper
  quality. Chapter 4 other-industry conclusions are bounded as a fast screening plus
  expert judgement. Management chapters use documents, interviews and named case
  plans. Size and chapter depth are high. Combined-effects conclusions are bounded
  by the authors themselves.

controversy_role: foundational
relevance_signal: high
relevance_rationale: >
  This is the room's large text on aquaculture versus other industries in the same
  sea, on which stressors have evidence versus weak evidence, and on whether
  environmental regulation can be more local and still legitimate.

included_because: >
  Selected by Marit Schei Olsen. It is the MILJØREG compilation of environmental
  effects and coexistence, which later AKVAFAGJUS treats as a predecessor. The room
  needs this environment-and-other-users layer, including inner-chapter bounds that
  the executive summaries flatten.

