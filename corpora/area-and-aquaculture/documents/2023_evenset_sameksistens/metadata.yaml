key_claims:
- FHF project MILJØREG, Akvaplan-niva report 2023 63547.01, dated 15 May 2023, 502
  pages, open. Collaboration of Akvaplan-niva, NIVA and Nofima. Project leaders Anita
  Evenset and Gro Harlaug Refseth. Norwegian cover title is Miljøkonsekvenser av
  akvakultur og sameksisterende næringer.
- 'Aim: compile research-based knowledge on environmental effects of aquaculture and
  of other industries in the same areas, then explore more direct and differentiated
  environmental regulation. Chapters 3-4 use a Quick Scoping Review. A QSR is not a
  full systematic review and does not critically appraise study quality. Search years
  are mainly 2010-2022. Cod was added late to the organic-waste search and that QSR
  was not repeated.'
- 'Included QSR volumes in chapter 3 (salmon and cod unless noted): organic waste 112
  papers (109 plus 3 added); dissolved nutrients 41 (28 plus 13 added, six of them
  Norwegian grey literature); contaminants 256 after full-text screen, of which the
  authors assign 164 to delousing agents; plastics 8 QSR papers plus grey literature;
  antifoulants 10 QSR papers plus grey literature; antibiotics 24 papers; escapes 237
  items; disease and parasites hundreds screened with more than half of extracted
  studies on sea lice; noise 10 aquaculture-relevant papers from 256 hits; light 1
  environmental-effect paper in the QSR; artificial structure 11 papers. Chapter 3
  executive summary said about 20 papers each for noise, light and structure. Body
  counts are lower.'
- Particulate organic waste is the best-documented farm stressor on soft bottom (NS
  9410:2016 B and C surveys). Hard-bottom and mixed-substrate effects lack standardised
  Norwegian monitoring and thresholds. Non-dispersive sites show severe effects mainly
  under cages and out to about 300 m. Dispersive or exposed sites can show effects
  out to 600-1000 m, and knowledge-gap text cites a diffuse impact area up to 1.5 km
  with possible overlapping farm footprints. Wave-driven seabed processes and higher-trophic
  effects are poorly known.
- Dissolved-nutrient papers report site-specific effects that in most gradient studies
  stay within about 500 m. Husa et al. 2014 concluded that Hardangerfjord parameters
  showed little evidence of a regional impact from aquaculture. Other county studies
  often classified phytoplankton and littoral macroalgae as good or high. Rogaland
  stations in Økland et al. 2022 showed eutrophication signs that the authors treat
  as mixed climate and nutrients, not a farm-only signal. ØKOKYST uses common eutrophication metrics
  but is not designed to capture aquaculture nutrient inputs. There were no nutrient
  QSR studies on wild fish or on farmed cod. TEOTIL2 figures for 2021 attribute about
  84 percent of anthropogenic coastal phosphorus and 60 percent of anthropogenic nitrogen
  to aquaculture, still below natural ocean input of dissolved inorganic nitrogen
  (SINTEF, 5-20 times aquaculture input).
- Delousing-agent literature is large and usable for regulation. In-feed residues
  are mostly local (flubenzurons found to 2 km) but persistent in sediment. Bath treatments
  can stay toxic over several kilometres (one modelled deltamethrin case up to 32 km;
  another combined study expected lethal shrimp concentrations up to 4-5 km over 6.4
  km2). Norwegian near- and far-field EQS exist only for flubenzurones, and use of
  that limit is described as unclear. Delousing agents are not in the traffic-light
  system. The authors warn that farms using more chemicals could gain growth via lower
  lice. Disinfectants and antimicrobial biocides lack enough discharge and marine-effect
  data.
- Copper antifoulant use in Norway was 1539 tonnes in 2020 and is declining (Vestland
  inspection 2023, over 90 percent reduction, almost phased out there). Impact is
  mostly local and long-lasting under reused sites. High-pressure net cleaning can
  pulse copper above the seawater EQS of 2.6 µg/l. Class 4 sediment copper has no
  clear management consequence. Substitute biocides such as tralopyril (Econea) lack
  robust marine environmental risk assessments. Antibiotics in Norwegian farming fell
  about 99 percent from 1987 to 2013. Plastics evidence is thin and loss estimates
  are not solid.
- Escapes retain 237 research items. About 65 percent concern Atlantic salmon, 12
  percent Atlantic cod, 7 percent rainbow trout, 4 percent cleaner fish. Salmon research
  covers hybridisation, competition and parasite-vector roles. Cod and cleaner-fish
  research is thinner. Norway monitors escaped salmon in rivers (2021, 79 percent of
  rivers low occurrence under 4 percent, 8 percent high over 10 percent). No equivalent
  monitoring exists for escaped farmed cod or cleaner fish. Escapees have been recorded
  across borders at scales of thousands of kilometres.
- More than half of disease-and-parasite impact studies concern sea lice. The literature
  supports farm-driven environmental lice levels (one 2017 estimate, over 99 percent
  of female lice from farms). Release-recapture prophylaxis results are highly variable
  (reported added mortality from 0.6 percent to 31.9 percent, one study up to 98.4
  percent). Population impact depends on stock status, temperature and other factors.
  Farm lice counts correlate weakly with wild-fish infestation in some Norwegian
  high-lice areas. Other viruses and bacteria show overall low prevalence in wild
  fish and few farm-outbreak correlations.
- Noise, light and artificial structure have thin aquaculture-specific evidence. Noise
  is judged unlikely to cause permanent injury except powerful acoustic deterrent
  devices on marine mammals at close range. Light QSR found attraction of invertebrates
  and fish but almost no footprint measurement. Structures act as fish-aggregating
  devices (wild-fish change reported to 170 m in one study). Long-term ecosystem
  consequences and non-native stepping-stone risks remain uncertain. Macroalgae is
  a shorter review, not a QSR. Small-scale benthic effects are mostly little to none,
  while spread of alien species, genes and pathogens is scored large or unknown because
  effects could be regional and irreversible.
- Chapter 4 states that the literature collection gave no results for direct impacts
  of other industries on aquaculture, and the discussion adds that no peer-reviewed
  or grey published information on direct and indirect risks was found. Targeted QSR
  yields were thin (particles 7 of 1086, nutrients 11 of 689, contaminants 8 of 2183
  after full screen). Where emission shares could be compared (nutrients, pesticides,
  copper), aquaculture is called the largest anthropogenic coastal input because of
  scale. Expert risk table 4.17 marks most other-industry risks to farmed-fish and
  public health as low. Nanoplastics is the only pressure marked possible for fish
  and consumer health, and farms emit plastic too. Future external harm is expected
  mainly from climate change and ocean acidification. Combined-effects literature
  is described as limited or missing. The search was not exhaustive.
- The GIS cumulative-impact case found suitable raw data often unavailable and coverage
  or resolution mostly moderate or poor. Development of CIA models for the Norwegian
  coastline, or for local focus areas, is limited or not feasible with the current
  open database. GeoNorge and Marine grunnkart are named as possible bases. Marine
  Grunnkart pilot areas are the most realistic small-scale test. Risk scores in chapter
  4 rest on expert judgement where data were missing.
- Environmental management of aquaculture is treated as a value-based social process,
  not only a technical exercise. Discretion and local adaptation should remain. The
  largest knowledge gap across aquaculture management, municipal coastal planning and
  water management is the link from human activity through stressors to environmental
  effect. Combined effects and activity-stressor-impact links are the weakest parts.
  Municipal plans legally place sea farms in A-areas. Water-management measures are
  decided by sector authorities, not by the water plan itself.
- 'Stressors the authors say should enter management more fully: particulate organic
  waste on hard or mixed bottom, escaped cleaner fish, copper antifoulants, lice (already
  covered but not enough) and delousing agents. Extra unused knowledge is named especially
  for delousing agents and copper. New farming concepts that document lower impact
  than inshore net pens, and more accurate regulation, could allow growth without a
  larger total footprint. Chapter 6 also says new species often face salmon-designed
  rules, and that industry-collected and real-time water-quality data are under-used.'
claims_about_uncertainty:
- The authors say knowledge will remain incomplete and that authorities must handle
  and show uncertainty. Some case files make it hard to see which assessments were
  actually made. Discretion can enable local adaptation and can also produce unequal
  treatment.
- Chapter 4 is a fast screening, not an exhaustive review of all activities, stressors
  or risks. Multi-pressure papers were largely outside the time frame. Table 6-1 and
  6-2 scores are described as judgement summaries to be read with caution.
- Growth toward 2050 is mentioned as a political possibility. The traffic-light system
  regulates whole production areas mainly on salmon lice. Local condition is used
  less. Lice-induced population mortality remains uncertain. Nutrient and organic-waste
  footprints are site-specific.
- QSR screening used two independent reviewers on title and abstract, then one full-text
  reviewer. Quality of included studies was not graded. Grey literature was added
  after several searches under-captured relevant reports.
claims_about_policy_or_management:
- Aquaculture management still lacks usable knowledge on dissolved nutrients, hard-bottom
  organics, vulnerable habitats, effects on marine fish, and environmental risk from
  cod farming. Assessments use substantial discretion. Mattilsynet distance rules
  for disease are recommended minima, not automatic.
- Municipal coastal plans are legally binding for farm siting. Combined effects and
  the activity-stressor-impact chain are the weakest parts of planning and water
  management. The Tromsø-region plan is presented as near best practice, with one
  objection on missing kelp-farming knowledge.
- Industry-collected data, including real-time water quality, are under-used. New
  species often face salmon-designed rules. Closed or semi-closed concepts could be
  allowed where lice and disease now cap growth if other stressors stay within limits.
- Delousing-agent risk assessment before treatment is done by fish-health veterinarians,
  not environmental specialists. Bath-treatment dump rules (500 m from shrimp fields,
  1000 m for flubenzurones) are shorter than modelled toxic distances.
methodological_limitations:
- QSR is faster and cheaper than a full systematic review and does not appraise study
  quality. Chapter 4 time limits excluded many activities and multi-stressor papers.
  Macroalgae used a literature review, not QSR. Cod was not fully integrated into
  every finfish search. Chapter 4 other-industry risks are expert judgements on thin
  published evidence. GIS CIA feasibility failed on missing raw data rather than on
  a completed model.
rag_summary: >
  Large 2023 FHF report (MILJØREG, 502 pages) from Akvaplan-niva, NIVA and Nofima.
  Chapters 3-4 are a Quick Scoping Review, not a quality-graded systematic review.
  Soft-bottom organic waste (112 papers) and salmon escapes (237 items) are well
  documented. Hard-bottom organics, noise (10 papers), light (1 environmental QSR
  paper) and structure (11 papers) are not. Nutrient effects are mostly local (about
  41 papers) and Hardangerfjord work found little regional signal, while TEOTIL2
  still assigns most anthropogenic coastal N and P to farms. Delousing agents dominate
  the 256 contaminant papers and can be toxic kilometres from a bath treatment, yet
  they sit outside the traffic-light system. Other industries yielded no published
  direct-impact results on farms. Expert judgement marks most external risks low,
  nanoplastics possible, and climate the main future external threat. Cumulative GIS
  mapping is not feasible with open Norwegian data. Management is treated as social
  weighing with lasting discretion, weak activity-stressor-impact methods, and a
  short list of stressors (hard-bottom waste, escaped cleaner fish, copper, lice,
  delousing agents) that should enter rules more fully.
