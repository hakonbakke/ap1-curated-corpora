key_claims:
- From 1 January 2010 counties took over allocation of aquaculture permits from the
  Directorate of Fisheries, plus objection authority for aquaculture in municipal
  area plans. For locality clearance the county coordinates the process and makes
  the final decision. Salmon, trout and rainbow trout remain a two-step process (company
  permit, then site). Other species apply for species, site and biomass together.
- The 2010 reform aimed to strengthen the regional elected level, improve coordination,
  strengthen industry development, and support more comprehensive coastal-zone planning.
  Processing deadlines were introduced at the same time. Rogaland was the only county
  that was not positive about the transfer. The Directorate estimated 11 full-time
  equivalents. Counties staffed more than that. Over half of the new staff came from
  the Directorate.
- The evaluation used document studies, FAKS decision-base statistics for 2020-2023,
  and 36 interviews with 38 informants (counties, municipalities, sector authorities,
  and industry) from October 2024 to January 2025. Two interviews were pairs. The
  rest were individual. The authors observed a FAKS gathering and a coordination meeting
  but do not quote those meetings. 2024 figures were left out because they were not
  yet reported.
- The report states that counties largely met the delivery goals, especially delivery
  capacity, competence, and quality. External partners and industry generally praise
  coordination. Adding the county is said not to have made applications more cumbersome.
  Some sector-authority informants question the balance between industry interests
  and environmental concerns.
- The deadline regulation sets a 22-week total for locality applications. Counties
  have no sanctions if other bodies overrun. For routine (kurante) cases, mean processing
  time was 21 and 20 weeks in 2020-2021, then 24 weeks in 2022 and 31 weeks in 2023.
  About 80 percent of applications were routine. New-site means were 56, 42, 50 and
  79 weeks. Change-of-site means were 22, 21, 24 and 27 weeks. All-case means were
  30, 26, 30 and 38 weeks. Medians for all cases were 20.7 to 23.7 weeks. More than
  85 percent of applications were granted in 2021-2023.
- Counties themselves largely kept the four-week final-decision deadline. Møre og
  Romsdal used 7.7 and 10.4 weeks in 2022-2023. Statsforvalteren used about 14-18
  weeks in 2020-2022 and almost 24 weeks in 2023 (limit 4). Mattilsynet used 12.7 to
  16.5 weeks. Municipal treatment sat a few weeks over the 12-week limit. Non-routine
  means were 53, 43, 55 and 66 weeks. One Vestland 2023 non-routine mean of 173 weeks
  rests on two cases.
- Cod aquaculture decisions rose from 7 in 2020 to 30 in 2023. Salmon, trout, and
  rainbow trout still dominate. The coded set for the seven main counties is 1 141
  change-or-new-site cases (853 routine, 279 non-routine, 874 changes, 267 new sites).
  Vestland had the most cases in the period. Nordland had 89 in 2020. Applications
  have become more complex, with more documentation and more coastal competition.
- FAKS, informal from 2010, pre-project in 2015 and formalised in 2016, is described
  as central for shared practice, knowledge, reporting, and equal treatment. From
  2016 all counties have delegated decision authority to the administration. Table
  1 shows 565 Nordland and 280 Troms political treatments in 2010-2016, then a sharp
  drop. Only two decisions were changed in political treatment in 2010-2018.
- Informants agree that locality structure along the coast needs improvement, but
  they do not agree on solutions. Stronger state steering and stronger regional or
  local coordination are both discussed. The county is said to lack the tools to change
  existing site structures. Industry informants say old gentleman's agreements on
  where to apply no longer hold, and that firms apply to keep others out. Counties
  cannot see the Directorate's historical capacity-utilisation data.
claims_about_uncertainty:
- The authors cannot evaluate each county separately. Differences may reflect persons
  rather than county structures.
- Decision-base data are not complete or quality-assured for all counties for 2010-2019.
  Direct comparison with processing times before 2010 is not possible. Internal FAKS
  papers say 2010-2015 means were in line with 22 weeks.
- Whether counties achieved more comprehensive coastal-zone planning is hard to judge
  because achievement depends on several actors. The study did not count objections
  or evaluate internal planning-versus-aquaculture cooperation.
- There is still no single official definition of a routine case. Counties have asked
  for one since 2005. Means are pulled by cases of 70 to more than 200 weeks. Table
  3 raw-file counts can differ from the decision base (Møre og Romsdal 2023 is 14
  versus 30).
claims_about_policy_or_management:
- The county is coordinating instance and final decision-maker for locality clearance,
  and has objection authority for aquaculture in municipal plans. In practice counties
  wait for all sector permits even when the regulation would allow them to proceed.
- Continuing FAKS is presented as central to a strong professional community and more
  uniform processing. The authors recommend more shared practice unless there is a
  clear regional reason to differ.
- Area use, cumulative load, and locality structure are named as the main future challenge.
  Informants are not agreed on how to manage the coastal zone better. Some want a
  national aquaculture directorate. Some want state planning guidelines that still
  leave municipal self-rule. Very few trust the industry to restructure sites alone.
- Some informants want a share of Havbruksfondet earmarked for coastal knowledge.
  Teaching permits and their school income are said to be at risk if NOU 2023:23 is
  followed. Statsforvalteren fee funding of posts may fall away under new pollution
  rules.
methodological_limitations:
- Commissioned evaluation (Troms fylkeskommune), September 2024 to 1 March 2025. Not
  a statistical test of reform effects.
- Interview sample cannot represent more than 100 municipalities and nearly all aquaculture
  firms.
- Processing-time analysis covers 2020-2023 and selected application types (new locality
  and change of existing locality, classified as routine or non-routine). Agder is
  in some national totals only. Figures 1-12 and appendix 6 screenshots are images.
rag_summary: 'Osmundsen and Olsen (2025) evaluate how Norwegian counties have administered
  the Aquaculture Act since the 2010 reform. Counties allocate permits, coordinate
  locality clearance, make the final locality decision, and may object for aquaculture
  in municipal plans. Methods are documents, FAKS statistics for 2020-2023 (1 141
  coded cases), and 36 interviews (38 informants). The report finds generally good
  delivery and praise for FAKS. Routine means rose from under 22 weeks in 2020-2021
  to 31 weeks in 2023. New-site means reached 79 weeks. Medians stay near 21-24 weeks.
  Overruns sit mainly at Statsforvalteren and Mattilsynet. Industry informants say
  firms apply to keep others out. Locality structure and cumulative load remain the
  hard problem. The study cannot score each county or measure coastal-plan outcomes.

  '
