key_claims:
- Private self-regulation among groups of farmers is studied as a way to handle shared-water
  externalities. The authors say it cannot work in isolation and needs alignment with
  public authorities. The looming shadow of the state is called a prerequisite. They
  also cite Ostrom against imposed cooperation as a panacea. Area cooperation should
  as far as possible be industry-initiated and voluntary.
- An initial charting had 22 respondents (16 industry, 6 authorities). An in-depth
  survey of 37 farmers (about 35 to 40 percent of salmon and trout farmers in 2019,
  total about 100) is summarised as also reported in Karlsen et al. (2019). Seventeen
  interviews cover the 2019 algae bloom. Two Food Safety Authority staff were interviewed
  in autumn 2018.
- All 37 in-depth respondents cooperate with other farmers on operations and emergency
  preparedness. Main motives are reducing disease and parasite risk, then environmental
  impact, then profitability. Coordinated fallowing and sea transfer are rated more
  important for production than coordinated delousing, which the authors link to greater
  use of cleaner fish and other continuous lice control.
- Thirteen of 37 agree that public authorities should be responsible for establishing
  cooperation. Twenty-one say cooperation should be voluntary. Twenty-three of 37
  report good cooperation in their area. Seven say cooperation includes only the small
  companies, three only the large companies. Two report no good cooperation. Two say
  they are alone in their area.
- Conflicts are reported more often where many farms share an area and distances are
  short. Newcomers into an established structure are named as a source of conflict.
  Food Safety Authority respondents name access to sites as the main barrier. Some
  farmers mention an unwritten rule not to compete for sites, which the authors say
  does not apply everywhere. Reluctance to give up sites can make fallowing zones
  too small. Food Safety Authority respondents say cooperation is unrewarded in the
  current system. The Authority increasingly mandates coordinated fallowing by approving
  the sum of operation plans.
- The spring 2019 bloom of Chrysochromulina leadbeaterii hit 14 farms in northern
  Nordland and southern Troms. Farmers lost 8 million salmon (14 000 tonnes). Some
  lost up to 85 percent of fish in the pens. Extraordinary profits in the preceding
  five years meant none were threatened by bankruptcy, but processing plants faced
  two years of lower deliveries. Seventeen interviews describe extensive farmer-led
  cooperation with public and research support, including farms of all sizes. Site-level
  preparedness plans often assumed the same local suppliers. When many farms were
  hit at once, that capacity was exceeded. Farmers improvised with purse seiners and
  the Coast Guard as a sea lab.
- Emergency sites and collective preparedness are named as tasks companies cannot
  solve alone. Smaller farmers without unused sites needed authorities to make sites
  available. Counties, municipalities, the Food Safety Authority and the Directorate
  of Fisheries should jointly develop a minimum of ancillary emergency sites in each
  production area. Collective emergency plans exist in some areas, not all. Practical
  exercises appear very rare.
claims_about_uncertainty:
- Farmers say it is easier to agree on a plan than to hold it when something happens.
  Rules are described as not always clear enough. An example is early slaughter when
  the processing plant is fully booked.
- The authors ask for more knowledge on the content of formal agreements between firms
  and suppliers, including well boats and fishing boats for sick or dead fish.
- Survey figures for motives, delousing and conflict sit in figures that are image
  placeholders in this extract. Counts used here are those written in the text.
claims_about_policy_or_management:
- Counties, municipalities, the Food Safety Authority and the Directorate of Fisheries
  should jointly develop a minimum of ancillary emergency sites in each production
  area.
- Public authorities should keep a stronger presence on emergency preparedness as
  a shadow of control, including stand-by resources or pre-agreed extra capacity.
- Cooperation and willingness to share is described as unrewarded in the current regulatory
  system (Food Safety Authority respondents).
methodological_limitations:
- Self-report survey N=37 and 17 crisis interviews. Initial mapping N=22. No independent
  measurement of lice, disease or profit effects of cooperation.
- Figures 1 to 8 are image placeholders in this extract.
rag_summary: 'Osmundsen, Karlsen, Robertsen and Hersoug (2021) study self-regulation
  among Norwegian salmon farmers as common-pool governance. Methods are an initial
  mapping (22 respondents), a national survey of 37 farmers, Food Safety Authority
  interviews, and 17 interviews on the 2019 toxic algae bloom. Farmers cooperate widely
  on operations and preparedness, mainly to cut disease and parasite risk. Most want
  cooperation to stay voluntary. Site competition and dense areas produce conflict.
  The algae case shows farmer-led crisis capacity and weak site-level preparedness
  when many farms need the same suppliers. The paper argues for voluntary industry
  lead plus a public shadow of the state, especially for emergency sites.

  '
