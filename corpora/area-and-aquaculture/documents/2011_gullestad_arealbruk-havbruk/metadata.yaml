main_uncertainty_sources:
- how production areas and fallowing zones should be drawn
- whether area measures alone can solve lice, escapes and production loss
- incomplete current and hydrographic knowledge
- lice fallowing zones large enough to matter are not sized
- lice and escape indicators are not yet operational
