key_claims:
- Kystplan Helgeland (2012-2019) involved 13 municipalities (later 11 after Brønnøy
  and Vefsn left). Plan area about 10 000 km2, about 12 500 islands and islets, coastline
  about 9 800 km (about 5 percent of Norway's coastline). The steering group did not
  receive delegated process authority under pbl section 9-3.
- The reversed method first marks sea where aquaculture is not wanted, then places
  most remaining sea in multi-use zones that include aquaculture (SOSI 6001). The
  first hearing draft put 83 percent of sea area in that category, with a rule that
  special reasons were needed to refuse aquaculture. Areas shallower than 20 m (13
  percent) banned food-fish farming but opened for new technology and species. Those
  shallow-water openings were later dropped.
- Municipalities received 56 objections, 39 notes of planning defects and 70 planning
  advices. All municipalities got objections to the special-reasons rule and to weak
  impact assessments for national and regional values (especially seabirds, traffic,
  recreation). Many also got objections on reindeer sea-crossing routes and NVE quick-clay
  risk.
- The project produced updated, standardised coastal plans and a common map, but
  not genuine holistic inter-municipal planning. An informant said the plan is consistent
  and homogeneous, not holistic. Horizontal coordination of method was stronger than
  positive coordination of content. Multi-use zones were described as search areas,
  returning toward application-by-application siting. Sequence rules, caps on number
  or distance of farms, species limits and cumulative load were not used.
- Conflict clearance and environmental judgement were shifted toward county and sector
  locality processing under the Aquaculture Act. The County Governor's objection power
  is limited to the plan phase. In allocation the County Governor mainly has a right
  to comment, plus a pollution permit where threshold fjords are the usual objection
  ground. Burden of proof in the plan process is described as falling on the County
  Governor.
- Brønnøy left because sea was not planned together with land (needed for new farm
  types). Vefsn left citing lack of a holistic view and wanting a less farm-friendly
  approach. Inner-fjord municipalities were less farm-friendly than outer-coast municipalities.
  Some informants called the one-size design a straitjacket.
- Fisheries interests generally received large reserved areas (spawning, lock-setting,
  shrimp fields). Passive-gear fishing grounds were mainly opened for aquaculture.
  Several informants said environment, outdoor recreation and tourism got little space.
  An earlier argument that reversed planning can strengthen non-farm interests was
  not observed here.
- Final compromise kept large multi-use zones, dropped the phrase omvendt metodikk,
  and added that aquaculture is not allowed if it has substantial negative consequence
  for registered national or regional interests, or if consequences are uncertain.
  The author treats that add-on as probably weak because it is unclear who judges
  and on what grounds.
claims_about_uncertainty:
- Knowledge gaps about nature values in large multi-use zones made assessments general
  and hard to use for precaution.
- How many new large sites the open zones will actually yield, given existing locality
  structure, is left bounded. The author says the new freedom sits on top of an already
  constrained site structure.
- The author says it is hard to isolate the method's contribution from project size,
  organisation and context. The method is not rejected in principle. It may fit when
  conflict is low, knowledge is good, and no known interest should outrank aquaculture.
claims_about_policy_or_management:
- Fisheries authorities have often promoted this method, including through objections
  when municipalities exclude aquaculture from large areas. The Directorate of Fisheries
  praised KPH while other agencies were described by a regional council as trying
  to torpedo it.
- Standardised plans and the reversed method increase flexibility for the industry
  and reduce the need for dispensation, but can also reduce predictability about sector-law
  clearance. Voluntary surrender of detailed siting power is described as a possible
  long-term risk to municipal self-determination.
- Pressure from KPH, together with central political signals, is said to have made
  the County Governor in Nordland ease some demands in plan negotiations.
methodological_limitations:
- Single-region case. Experiences from the farming companies are explicitly not discussed.
- One map illustration is an image and was not read as data.
rag_summary: 'Sandersen (2021) studies Kystplan Helgeland, the largest inter-municipal
  coastal-zone planning project in Norway to that date. Using documents and 28 interviews,
  he analyses the reversed planning method: exclude aquaculture first, then open most
  remaining sea as multi-use including aquaculture. The first draft put 83 percent
  of sea in that category and required special reasons to refuse a farm. The process
  updated and standardised plans but did not deliver holistic inter-municipal planning.
  Many objections concerned weak impact assessment and the special-reasons rule.
  Flexibility for aquaculture moved detailed conflict clearance into locality licensing.
  Inner-fjord municipalities were less farm-friendly than outer-coast municipalities.
  Brønnøy and Vefsn left. The author does not reject the method in principle, but
  finds it a poor core method for a large standardised project.

  '
