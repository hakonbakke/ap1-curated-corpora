key_claims:
- The 2010 administrative reform moved selected aquaculture planning, coordinating and decision-making tasks from the Directorate of Fisheries regional offices to County Councils, aiming at self-governance through decentralisation.
- International ICZM and EBM trends pointed the other way, toward larger geographic units and more integrated ecosystem management. The paper treats that opposition as the dilemma.
- Counts at the time of writing include 17 sea-bordering counties and 276 sea-bordering municipalities, of which 14 and 160 had salmon and trout licences. Decision units went from 7 Directorate offices to 14 coastal County Councils.
- De facto transfer of decision-making authority is described as limited, mainly administrative tasks. Specialised sector agencies remain largely unchanged. Horizontal coordination between counties is more likely to fall because units are smaller and more numerous.
- For EBM the reform may hamper larger connected ecological areas. For local ICZM a small increase in municipal coordination is a step forward. Real devolution of authority to counties is said not to have occurred.
- Conclusion: the reform is more likely to improve municipal-level ICZM and less likely to facilitate larger cross-county EBM. Counties as broad democratic institutions may still help coordinate municipal coastal plans.
claims_about_uncertainty:
- Effects are assessed as possible consequences, not measured processing times or later FAKS statistics.
claims_about_policy_or_management:
- Green-licence awards are cited as an example where biological expertise and coalition politics largely bypassed the county level.
- A further step toward ICZM would require greater delegation of authority to County Councils, preferably in units that match ecological production zones.
methodological_limitations:
- Theory-led initial study. Figures 1 and 2 are images. Not a 15-year evaluation of the 2010 transfer.
rag_summary: >
  Sandersen and Kvalvik (2014) assess the 2010 Norwegian administrative reform
  that moved selected aquaculture tasks from the Directorate of Fisheries to
  County Councils. The reform aimed at regional self-governance. International
  ecosystem-based coastal management was moving toward larger units. They find
  limited real devolution, a risk of more fragmented aquaculture management
  because decision units multiplied from 7 to 14, a possible gain for municipal
  ICZM, and a weaker prospect for cross-county EBM. This is an initial
  document-and-theory study, not a later process evaluation.
