key_claims:
- 'The paper says the traffic-light system promotes environmental sustainability and economic growth, and largely ignores legitimacy and acceptance as conditions for industry development.'
- 'Methods stated in the abstract are qualitative interviews and document analysis of how stakeholders perceive and weigh dimensions of sustainability.'
- 'The abstract states that low social sustainability, from low content legitimacy and acceptance, places stakeholders in an interest tug of war.'
- 'The conclusion in the abstract is that legitimacy and acceptance are prerequisites for growth, and that a lack of them may affect procedural legitimacy and the Norwegian institutional setup.'
- 'Context cited in the introduction, not a finding of this study: Norway produced 1.1 million tonnes of Atlantic salmon in 2019, almost 9000 people were employed in aquaculture, and export value was about NOK 72.5 billion. A fivefold increase from 2010 to 2050 is cited as a government ambition. The industry claim of 133,000 jobs and 17.5 billion meals is attributed to the industry, not measured here.'
