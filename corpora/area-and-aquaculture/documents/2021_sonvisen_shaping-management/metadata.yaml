rag_summary: >
  Sønvisen and Vik (2021) argue that the traffic-light system steers Norwegian
  salmon farming toward environmental sustainability and economic growth while
  leaving out legitimacy and acceptance. The stated method is qualitative
  interviews and document analysis. The abstract reports that stakeholders weigh
  sustainability dimensions differently, and that low content legitimacy and
  acceptance produce low social sustainability and an interest tug of war.
  Legitimacy and acceptance are treated as prerequisites for growth, with a
  possible effect on procedural legitimacy and the institutional setup. Figures
  in the introduction for 2019 production, employment and export value, and the
  fivefold growth ambition, are cited context. An industry claim of 133,000 jobs
  and 17.5 billion meals is attributed to the industry, not to this study.
