quality_rationale: 'Plenary-accepted full assessment with traceable accounts, chapter
  executive findings, and explicit knowledge-gap sections. Curation walked SPM key
  messages and each numbered chapter’s findings, caveats and coastal or aquaculture
  hits. Still a global values assessment, not an aquaculture planning study. Source
  base is English-heavy and IPLC valuation remains thinly documented.

  '
controversy_role: peripheral
relevance_signal: low
relevance_rationale: 'Peripheral as a siting or licensing source. The object is diverse
  values of nature in global decision-making (A3 trade-offs). The extract’s Norway
  hit is Box 4.3 on implicit valuation in planning versus sector acts, not farm placement.
  Coastal and aquaculture wording elsewhere is a UK fisheries box, a habitat category,
  or an illustrative mangrove or valuation-method example.

  '
included_because: 'Selected by Ragnar Tveterås together with the SPM. Keep it as the
  long values assessment in the same pair. Do not collapse it into the SPM, and do
  not retag it as an aquaculture area paper.

  '
