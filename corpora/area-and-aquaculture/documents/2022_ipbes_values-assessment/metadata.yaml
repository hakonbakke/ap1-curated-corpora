coi_notes: 'Intergovernmental assessment. Trust-fund donors include many governments
  (Norway among them). Earmarked French support and in-kind hosting by UNAM for the
  technical support unit. David N. Barton (NINA, Norway) is a coordinating lead author
  of chapter 4. Arild Vatn is a chapter 1 lead author. No personal competing-interests
  statement was found in the pages walked.

  '
