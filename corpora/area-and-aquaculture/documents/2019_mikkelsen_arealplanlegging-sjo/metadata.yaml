key_claims:
- 'The report is part of FHF project Havbruksforvaltning 2030 (901391), work package
  on area management. English cover title: Changes to area planning for sea-areas
  (in Norway)? Possible significance for aquaculture. Nofima report 11/2019, 60 pages,
  dated 31 March 2019.'
- In a 2015 industry survey, more than 60 percent of respondents named access to area
  as the largest problem (cited from Hersoug et al. 2014). Salmon volume in 2016 and
  2017 was lower than in 2015 after lice restrictions and a tighter lice regime from
  2015.
- In 2017, Hordaland used 99 percent of approved salmon and trout sea sites during
  the year. Other counties left between about 10 and 30 percent unused. Average monthly
  use of approved sites was about 50 to 70 percent. Hordaland also had the highest
  locality density (more than 8 times Finnmark) and the highest peak biomass per km2
  of coastal zone. Møre og Romsdal had the highest standing biomass relative to approved
  locality MTB. Finnmark had the lowest share of approved sites in use.
- The three northern counties hold more than 60 percent of Norway's coastal-zone sea
  area (to 1 nautical mile outside the baseline), and with Trøndelag more than 75
  percent. Nordland has almost twice the coastal-zone area of Finnmark.
- Chapter 2 reviews incentives for municipalities, counties and the state to host
  aquaculture. Richardsen et al. (2018) are cited for a little over 33 000 value-chain
  årsverk in 2016, of which about 21 percent (around 7000) were in aquaculture itself
  and 71 percent were ripple effects. Property tax on cages and buildings (not fish)
  is cited as about 26 500 kr per approved locality per year at the 7 per mille maximum
  (Isaksen et al. 2012), described as a modest incentive.
- Havbruksfondet and 2018 capacity sales are stated as more than 3.9 billion kroner
  (state 20 percent, municipalities and counties 80 percent, of which 7/8 to municipalities).
  Municipalities received about 3 million kroner per locality for 2018-2019 combined.
  The fund pays mainly by share of approved locality MTB, with a small extra for newly
  cleared sites. The authors say this raises the incentive to host sites, while lice,
  escapes and treatment controversies weaken it. They cannot conclude who among municipality,
  county and state has the strongest incentive.
- 'Six planning aspects are varied: plan area, planning authority, participation,
  knowledge base, trade-off methods, and plan form. Few assessed changes are said
  to give more aquaculture area with certainty or high probability. Three candidates
  are named: larger plan areas, auction of pre-screened area blocks, and marine industrial
  parks. If auction income went to planning authorities, that would add an incentive
  to designate blocks.'
- 'Other changes are proposed to make trade-offs more predictable rather than to expand
  area: more equal treatment across geography for regional and state interests, and
  systematic knowledge collected outside plan processes and made public so debate is
  less driven by misconception. Municipalities remain planning authority for nearshore
  sea. Neighbours already have objection rights. Requiring inter-municipal plans or
  making regional coastal plans legally binding is discussed as politically unlikely
  in the near term after the 2019 Municipalities Act.'
claims_about_uncertainty:
- The authors state there is considerable uncertainty and disagreement about how aquaculture
  affects the environment and other coastal users.
- Effects of requiring inter-municipal plans or making regional coastal plans legally
  binding are discussed as politically unlikely in the near term.
- Future Havbruksfondet payments are described as highly uncertain. The 2018 round
  is used as the best available estimate.
- Closed, offshore or mobile technology could weaken the search for super-localities
  and change veterinary distance needs. That is posed as an open question, not a finding.
  Open-cage coastal technology is the baseline.
claims_about_policy_or_management:
- Municipalities remain planning authority for nearshore sea area. Neighbours already
  have objection rights. Inter-municipal plans still need each municipal council to
  adopt the plan for its area.
- If auction revenues went to planning authorities, that would add an incentive to
  designate blocks.
- Production areas (13 from autumn 2017) span several municipalities, so municipal
  plans are not expected to plan a whole production area as one unit.
- A resource-rent tax for aquaculture was under investigation at the time of writing.
methodological_limitations:
- Policy options paper. No new field experiment. Area-scarcity figures come from Directorate
  of Fisheries statistics as compiled by the authors. Several figures in the extract
  are images, so exact biomass-share values are not fully readable as numbers.
- Value-creation per locality (about 58 million kroner and 39 employed) is labelled
  a rough estimate from Richardsen et al. (2018) and 978 approved sites in 2016.
- Reform effects are reasoned, not measured.
rag_summary: 'Mikkelsen, Karlsen and Osmundsen (Nofima report 11/2019) review how
  Norwegian sea-area planning could be changed and what that might mean for aquaculture
  access, other interests, and process efficiency. The report is part of FHF project
  Havbruksforvaltning 2030. It combines planning-law description, a chapter on municipal
  incentives (jobs, property tax, Havbruksfondet), and 2017 site-use statistics. Hordaland
  stands out on density and site use. Few options are judged likely to expand aquaculture
  area. Three candidates are larger plan areas, auction of pre-screened blocks, and
  marine industrial parks. The authors stress predictability, equal treatment of regional
  and state interests, and knowledge collected outside plan processes. Coastal-zone
  open-cage technology is taken as the baseline. Offshore and closed systems are flagged
  as possible later changes to the premises.

  '
