key_claims:
- Industry- and municipality-funded report for BluePlanet. Preface dated Stavanger,
  20 November 2023. Ragnar Tveterås is named as project leader. The preface speaks
  of report authors in the plural. No other author names appear on the title, preface,
  contents or later pages of the extract.
- The report asks whether a large increase of salmon and trout production in sheltered
  coastal waters (100, 200 or 300 percent, or a widely stated 5 million tonnes by
  2050) is possible and sustainable. It says this is not possible with 2023 knowledge,
  technology and practice from egg to harvest.
- Production of salmonids is stated as rising from 150 000 tonnes in 1990 to 1 650
  563 tonnes round weight in 2022. Chapter 2 also gives FAO series of 4 000 tonnes
  of salmon in 1980, 146 000 in 1990, 440 000 in 2000, 940 000 in 2010 and about 1
  550 000 in 2022, plus about 85 000 tonnes of rainbow trout. Approved grow-out localities
  fell from over 1 100 to a little over 900 after 2006, while locality MAB rose from
  2.1 to 3.5 million tonnes. Chapter 3 registers 1 164 localities in 2006 and 969
  in 2022, and locality MAB of 2 176 681 tonnes rising to 3 521 311 tonnes.
- Density of localities and of live biomass per km2 is highest in areas 2 and 3. Northern
  areas have lower density. At the end of 2022 about 436 million farmed salmon are
  said to have stood in the sea, against an estimated 458 000 returning wild salmon.
  About one third of localities are said to be fallow at any time.
- Chapter 3 is not a set of municipal case narratives. It is register analysis. Almost
  300 new localities arrived after 2012 and replaced a similar number removed. Of
  957 existing commercial localities, about 60 percent gained MAB (average about 2
  750 tonnes). The 20 largest companies accounted for 74.94 percent of the MAB increase
  and about 45.37 percent of the fall in locality numbers. After 2017, Trøndelag and
  counties further north supplied 87 percent of national production growth. Vestland
  still grew 22 percent in 2017-2022 despite one or two company-MAB cuts in areas
  3 and 4. Area 13 is the exception with no rise in total locality MAB. Mean distance
  between active sites stays about 3-5 km in most areas.
- Among the 20 largest farming municipalities, Flatanger and Rødøy have the highest
  locality-MAB per inhabitant. Kvinnherad and Austevoll barely raised locality MAB
  from 2006 to 2022. Samnanger is given a locality-MAB to sea-area ratio of 148.57.
  Træna has the lowest such ratio. The prose on Karlsøy, Tromsø, Rødøy and Steigen
  contradicts itself on whether a ratio under 60 means high or low MAB per km2.
- Regressions on 2012-2022 data are reported as showing that mortality, economic feed
  factor and adult-female lice counts rise significantly with locality density and
  biomass per km2 of sea. Production cost per kg rises with area density, while cost
  is stable or falls with more biomass on the individual locality. Operating margin
  falls with area density and rises with locality biomass. The authors say economics
  therefore favour fewer, larger localities, while biology punishes area-level concentration
  under 2012-2022 technology. Tables 5.1-5.3 report signs, not coefficients.
- They recommend an MAB conversion scheme toward closed MAB. In the executive summary
  the simulated conversion factor that leaves firms indifferent sits between 2 and
  5 at 10-16 percent required return. Chapter 7.1's base case is 3 tonnes closed MAB
  per tonne open MAB (NPV 119.09 versus 39.73 kroner per kg MAB). Sensitivity spans
  about 1.2 to 32 depending on cash flow, capex and required return. Chapter 7.2 says
  closing the 10 percent of sites with the highest lice infection pressure can raise
  production, cut area mortality, and double remaining open-pen operating margin from
  about 15 to over 30 percent, with diminishing returns after that. At a 1:1 conversion
  the closed-pen NPV is negative unless the long-run salmon price exceeds 100 kroner
  per kg HOG at a 10 percent required return.
- Sector vetoes in locality clearance are described as producing a lowest-common-denominator
  outcome and slow, unpredictable siting. They want clearer sector roles, state planning
  guidelines that ease dispensation from old municipal plans, easier new sites and
  capacity in green traffic-light areas, and they want shared and inter-regional biomass
  caps kept. As of April 2023 no state planning guideline on aquaculture priorities
  existed. Company-level permit capacity and locality capacity are said not to hang
  together. Chapter 9.3 says locality capacity is almost four times company capacity.
- They criticise parts of the 2023 Aquaculture Committee (Havbruksutvalget) for over-central
  planning that ignores the Planning and Building Act's all-interests logic, and for
  suggesting an end to shared biomass caps across production areas without studying
  the extra locality need. They support removing traffic-light capacity cuts, and
  they support a licence-leasing idea. They treat firebreaks as having a debated biosecurity
  effect.
claims_about_uncertainty:
- The authors stress that the regressions are average associations from 2012-2022
  practice. Some high-biomass localities and some dense areas still have good biological
  results.
- Closed and deep-farming concepts are called early, with mixed experience and investment
  tickets from about 100 million kroner to well over one billion kroner. Thirteen closed
  or semi-closed plants are said to have held live fish. Economic results of closed
  plants are called a large knowledge hole.
- Ground-rent tax implementation is said to have cut investment, including in lower-emission
  technology. How long that lasts is left open.
- Conversion and partial-closure results are conceptual. Chapter 7 says they depend
  on chosen models, variables and coefficients, and that a lice tax is hard because
  lice are treated as non-point source pollution.
- Locality counts before 1999 are estimated (one site per permit to the early 1990s,
  then two times the number of permits in 1991-1998). The authors call that estimate
  uncertain.
claims_about_policy_or_management:
- A national biosecurity strategy, data sharing, and incentives for best practice
  are treated as conditions for sustainable coastal-area use.
- They support removing traffic-light capacity cuts as a tool, on the argument that
  repeated cuts have not improved modelled lice outcomes in some areas and lose legitimacy.
- They want MAB conversion to closed systems, a documentation research programme,
  use of cut MAB in closed units, and risk relief rather than a lice tax.
- They want Mattilsynet to ease movement of clinically healthy fish and to weigh industry
  and fish-health-network views more in coordinated fallowing. They want state planning
  guidelines that ease dispensation and stop temporary bans under Planning and Building
  Act section 13-1 while plans are revised. A single aquaculture directorate is named
  as a long political path.
- The printed recommendations (veikart) cover biology and welfare, MAB conversion,
  epidemiological models, municipal income and planning, and business-model innovation.
  Chapter 11 points back to the executive summary.
methodological_limitations:
- Mix of Fisheries Directorate series, regressions reported as signs, conceptual conversion
  models, technology discussion and legal-policy commentary. Full author list is not
  in the extract. Client and funders are aquaculture companies, banks, municipalities,
  Sjømat Norge and related funds.
- Most figures are images. Tables 5.1-5.3 give signs only. One appendix sentence on
  four-site capacity utilisation is unfinished.
- Interviews and meetings are mentioned in the preface. No interview transcripts or
  informant counts appear later.
rag_summary: 'BluePlanet-commissioned report dated 20 November 2023, led by Ragnar
  Tveterås. It asks how to grow inshore salmon and trout without today''s health and
  lice limits. Locality numbers fell after 2006 (1 164 to 969) while locality MAB
  rose to 3.52 million tonnes, especially in the north. The 20 largest firms took
  most of that MAB rise. Regressions for 2012-2022 link higher area density to worse
  biology and cost, and higher site biomass to better economics. Chapter 7 puts a
  base closed-to-open conversion factor at 3, and says closing the 10 percent of sites
  with the highest lice pressure can help remaining open pens. The authors want MAB
  conversion, clearer siting rules, and they dispute parts of the 2023 Aquaculture
  Committee. Other authors are not named in the extract. Funders are mainly industry
  and coastal municipalities.

  '
