key_claims:
- A legitimacy gap exists between blue growth goals and fishers in the communities
  studied, while the general public holds a positive attitude towards aquaculture.
- The aquaculture industry is perceived to generate local employment, ripple effects
  for suppliers, and increased income for the municipality.
- Fishers perceive aquaculture negatively due to restricted access to areas, declining
  shrimp catches, and changes in fish quality.
- The general public is more positive about aquaculture's socio-economic benefits
  but acknowledges its negative environmental impacts.
- There is a need to differentiate between the general public and key stakeholders
  like fishers in assessing aquaculture's legitimacy.
claims_about_uncertainty:
- The perception of aquaculture's impact varies significantly between the general
  public and fishers.
- Fishers' negative perceptions are based on their direct experiences and competition
  for space with aquaculture.
claims_about_policy_or_management:
- Understanding the range of views on aquaculture is crucial for developing a socially
  acceptable and sustainable industry.
- Improving input legitimacy for key stakeholders like fishers could enhance output
  legitimacy for the aquaculture industry.
methodological_limitations:
- The study relies on perceptions, which are subjective and may not reflect objective
  realities.
- The structured interviews may not capture the full complexity of local attitudes
  towards aquaculture.
rag_summary: This study explores local perceptions of the aquaculture industry in
  Northern Norway, focusing on its legitimacy and impact on coastal communities. It
  finds a legitimacy gap between the blue growth goals of the Norwegian government
  and fishers, who perceive aquaculture negatively due to restricted access to areas
  and environmental impacts. In contrast, the general public holds a more positive
  view, appreciating the socio-economic benefits of aquaculture. The study highlights
  the importance of differentiating between the general public and key stakeholders
  like fishers in assessing aquaculture's legitimacy. It suggests that improving input
  legitimacy for key stakeholders could enhance the industry's overall legitimacy.
