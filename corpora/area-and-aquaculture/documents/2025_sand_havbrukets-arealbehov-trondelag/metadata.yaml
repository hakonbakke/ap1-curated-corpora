relevance_rationale: 'Regional application of the national footprint debate, including
  how much sea municipalities have already zoned for mixed uses that can include aquaculture,
  and which conflict types the authors list in chapter 6.

  '
included_because: 'Selected by Marit Schei Olsen. It is the aquaculture annex to the
  Trøndelag bioeconomy area assignment, with county numbers and conflict types, not
  a national licence history. It shows why physical area and usable area diverge in
  one production region.

  '
