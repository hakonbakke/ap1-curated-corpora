key_claims:
- SINTEF report 2025:01117, version 1.3, dated 31 October 2025, 29 pages. ISBN 978-82-14-07347-8.
  Companion delrapport to Sand et al. 2025:00943 for Trøndelag County Municipality.
  Written from the industry side of that assignment.
- Physical occupation of production area in the sea is first stated as less than one
  percent of Trøndelag coastal zones. Chapter 5, citing Skrove et al. 2023, calculates
  salmon farm occupation at 15-42 km2 or 0.2-0.4 percent, and about 0.5 percent if
  other species and a 100 m fishing ban are included. Chapter 7 restates a half percent.
- With Food Safety Authority-style radii (2.5 km for fish, 1.5 km for other species)
  the same source is used to say today's farming takes about 20 percent of sea area
  in production areas 6 and 7. The authors call that a coarse pointer, not a map of
  suitability or other users. Remaining sea is used for conservation, defence and,
  not least, fisheries.
- Trøndelag is given about 19 percent of national grow-out capacity. Seafood was 61
  percent of regional exports in 2022. In 2023 about 243 100 tonnes were slaughtered,
  first-hand value 17.2 billion kroner, of which only about 3 300 tonnes and 119 million
  kroner were not salmon. Chapter 4.1 estimates 11 400 jobs and 17.7 billion kroner
  value creation including ripples in 2022. Chapter 7 restates about 16 billion kroner.
- 'SSB 2024 figures in the report: 42 190 km2 land including freshwater, 10 856 km2
  coastal-zone sea in municipal plans, about 15 200 km2 to the territorial limit.
  Municipalities have set aside 4 650 km2 or 43 percent of the coastal zone to combined
  purposes that can include aquaculture. Osen has 10 km2 set aside for aquaculture
  alone, but sits at the top of a production area and a sanitary zone. Applications
  there have often been refused.'
- Sites are concentrated around Hitra/Frøya and Nærøysund and otherwise spread along
  the coast. An inter-municipal coastal plan for the southern coast up to Osen was
  adopted in 2015. An attempt for Namdalen and Fosen failed. In production areas 6
  and 7, company capacity was 205 000 tonnes at 31.12.2023 while cleared locality
  capacity exceeded 870 000 tonnes, of which 79 percent was in Trøndelag. Trøndelag
  is described as a yellow traffic-light zone.
- Main constraints on today's open-pen system are lice, disease and escapes, plus
  weaker social acceptance and harder area access. Submersible pens and more closed
  systems are described as under investment. Land-based grow-out is treated as possible
  but politically gated. A temporary halt on land-based permits from 2022 is said
  to have been lifted from summer 2025. Ten plants like the planned Kvidul site are
  said to be in the same order of magnitude as today's Trøndelag salmon output. More
  than 10-20 such plants is called unrealistic.
- 'Chapter 6 conflict types: inside the sector (salmon versus cod, recommended 5 km
  distances, PD zones), wild salmon (lice and escapees) and wild coastal cod (spawning
  in pens, HI advice of very cautious cod-farm growth until 2025/2026 knowledge),
  kelp (current about 1.2 km2, potential 82 km2 or about 2 percent after conflict
  areas are removed), land-based irreversible works and power demand, offshore (Frøyabanken
  Nord and Trænabanken), feed-crop competition with agriculture, and visual, noise,
  defence and marine-protection interests. Corals, coralline algae and sponge areas
  are named as knowledge-poor risk objects (Grefsrud et al. 2025).'
claims_about_uncertainty:
- The authors say the sanitary-distance percentage is not detailed enough for technology
  or other-user effects.
- Land-based potential is left open. Whether government will allow large land-based
  growth is treated as the larger question. Coastal power capacity, especially in
  Ytre Namdal and Hitra/Frøya, is called a hard constraint (NCE Aquatech 2025).
- Global trade uncertainty can raise or lower area need. The net effect is left unknown.
- Chapter 6 is a structured review of conflict types, not a measured inventory of
  every dispute.
claims_about_policy_or_management:
- Sustainable growth is said to need better use of existing sites and new sites with
  better-adapted systems, plus more holistic locality plans across municipalities.
  The 2025 aquaculture white paper is cited on technology, welfare, lice and escape
  charges, and planning. An informant expects today's systems to remain for about
  two to three years while proposals are studied.
- National salmon fjords (Trondheimsfjorden, Namsenfjorden) still ban salmon grow-out
  and broodstock. Some actors look at high-biosecurity land plants as a future option
  there.
- Osmundsen and Olsen (2025) are cited for longer locality processing. Counties themselves
  largely keep deadlines. Mattilsynet and Statsforvalteren overrun.
methodological_limitations:
- Industry-perspective delrapport. Named informants from NCE Aquatech, former producer-organisation
  and research-funding roles, and Sjømat Norge. Maps from Barentswatch, the Fisheries
  Directorate and SSB. Not a new farm-level census.
- Core percentages are imported from Skrove et al. 2023 rather than recomputed from
  raw farm polygons in the pages read.
- Value-creation figures differ across first-hand 2023 value (17.2 billion), 2022
  ripple estimate (17.7 billion), and the chapter 7 restatement (about 16 billion).
rag_summary: 'SINTEF delrapport 2025:01117 (31 October 2025) by Sand and Misund on
  aquaculture area need in Trøndelag, written from the industry side of a county bioeconomy
  assignment. Physical farm occupation is about 0.5 percent of the coastal zone.
  Sanitary distances raise occupation toward about 20 percent of sea in production
  areas 6 and 7. The county holds about 19 percent of national grow-out capacity.
  Constraints are lice, disease, escapes, acceptance, planning time and coastal power.
  Chapter 6 maps conflicts with fisheries, wild salmon and cod, kelp, land-based
  plants, offshore farming and other sea users. New systems and land-based plants
  could open other area, with political and environmental conditions attached.

  '
