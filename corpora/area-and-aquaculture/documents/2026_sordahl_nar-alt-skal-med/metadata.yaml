key_claims:
- The dissertation studies how integrated coastal-zone planning is created as a concept and as tools, at the intersection of politics and administration. Empirical focus is nearshore sea in Norway.
- Area is a limited good. Fisheries, aquaculture, tourism, energy and nature conservation compete for much the same water.
- There is more agreement that holism is the goal than on what it means. Catchwords can have political recognition and little administrative content.
- Two approaches to holism sit in tension. A scientific one simplifies and standardises. A political one expands what planning must include. Holism is normative, not a technical solution.
- Bringing more themes under one umbrella breeds more complexity. Decisions still happen, so conflicts can be handled without the conflict picture disappearing. Final municipal competence sits with the municipal council. Planning as technique cannot deliver holism by itself.
- Holism can still serve as a shared flexible frame if ambitions stay sober. The same breadth makes it dangerous because it looks unifying and legitimate.
claims_about_uncertainty:
- Section 7.3 discusses transferability and further research. This curation did not re-walk every page of the appended articles.
claims_about_policy_or_management:
- Institutional sustainability is named as a fourth sustainability dimension: clear roles, predictability, participation, and decisions that give direction. A lasting gap between holism as goal and the need to prioritise may weaken that.
methodological_limitations:
- Article-based PhD. Paper II is also filed separately. Kappa walk is the basis for this record.
rag_summary: >
  Sørdahl (2026) is a UiT dissertation on how integrated coastal-zone planning
  is made, in the meeting of politics and administration. Coastal area is
  limited. Many uses compete. Holism is widely named as the solution and poorly
  agreed as a meaning. A scientific drive to standardise sits against a
  political drive to include ever more. More themes under one umbrella breed
  more complexity. Municipal councils still decide. Planning as a technical
  tool cannot deliver holism alone. The concept can still be a shared frame if
  ambitions stay sober.
