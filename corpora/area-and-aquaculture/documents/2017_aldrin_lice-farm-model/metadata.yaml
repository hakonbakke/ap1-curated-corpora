key_claims:
- The paper estimates a mechanistic stage-structured Bayesian hierarchical model of
  salmon lice (Lepeophtheirus salmonis) at individual salmon farms, including the
  hierarchical structure of full-scale farming. Ecological Modelling 359 (2017) 333-348.
  Open access under CC BY 4.0.
- Parameters were estimated from cage-level production and lice-count data on 32 marine
  salmon farms in Norway. Twelve of those farms sit just north of Frøya in Mid-Norway.
  Salmon were stocked between 2011 and 2013 and slaughtered about one and a half years
  later, between 2012 and 2014. Cages per farm ranged from 3 to 12 (mean 7.7). The
  last 3-11 months of data for five farms were held out to evaluate conditional
  predictions.
- External recruitment uses a seaway-distance-weighted sum of adult female lice at
  neighbouring farms. The distance function g(d) = exp(-0.618 d^0.568) is taken from
  Aldrin et al. (2013), which the authors say was estimated from more than eight years
  of data on all 1400 Norwegian salmon farms active in that earlier period. The kernel
  is not re-estimated here.
- Neighbouring adult females are assumed to be at stage-age 10. The authors call that
  choice rather arbitrary and say results were insensitive to it.
- The average proportion of recruitment that is internal is 25 percent (credible interval
  23-26 percent), median 19 percent, farm range about 4 to 73 percent. Internal recruitment
  was more important where adult-female abundance was high, especially on farms without
  neighbouring farms. Sixteen of the 32 farms had at least one neighbour within 3.54 km
  seaway. The authors say this internal share is below Aldrin et al. (2013) and is
  closer to a median of 18 percent in Adlandsvik (2015), a hydrodynamic simulation
  of 591 farms.
- Expected values fitted observed chalimus, adult female, and other mobile stages
  reasonably well. Predictions for the held-out months were consistent with the observational
  data.
- At 10 degrees C, ten days after bath treatment, expected cumulative mortality in
  pre-adult or adult stages was 0.99 for hydrogen peroxide (interval 0.97-1.00), 0.94
  for deltamethrin or cypermethrin (0.89-0.98), and 0.75 for azamethiphos (0.64-0.86).
  The authors say they found no evidence of density-dependent reproductive rates (Allee
  effect). The reproduction-rate parameter they report is 493 (interval 482-498). Daily
  cleaner-fish mortality is 0.028 (interval 0.022-0.034), implying about a one-month
  half-life. At a 10 percent cleaner-fish to salmon ratio, daily lice mortality from
  cleaner fish is 0.079 (0.060-0.099), and adult-lice life expectancy falls from 8.2
  to 5.2 days.
- The introduction cites earlier work that large-scale host density dependence of
  pathogen transmission has been shown in salmon farming. Those density statements
  are citations, not new national density estimates in this extract. The paper does
  not analyse coastal plans or municipal siting.
claims_about_uncertainty:
- The assumed stage-age of 10 for neighbouring adult females is described as rather
  arbitrary. The authors say results were insensitive to that choice.
- Internal recruitment here is lower than in Aldrin et al. (2013). The authors attribute
  part of the difference to model structure and to different reporting-based farm
  data in the earlier paper.
- Salinity was unused because the authors say it was unavailable in sufficient detail.
- Treatment effects are hard to compare because assumed duration varies by treatment
  and temperature, and because lice develop resistance.
claims_about_policy_or_management:
- The authors argue the model may improve strategies to control the parasite, including
  by quantifying cleaner-fish effect in full-scale farms. They do not analyse coastal
  plans, licences, or municipal siting.
- They note that the internal-versus-external recruitment debate has a bearing on
  motivation for controlling adult-female lice at the farm level.
methodological_limitations:
- Open-access farm-level Bayesian model on 32 farms supplied by three companies, not
  a census of all Norwegian sites.
- Between-farm pressure uses a previously published distance kernel.
- No coastal-planning, licence, or area-allocation analysis.
rag_summary: 'Aldrin et al. (2017) estimate a stage-structured Bayesian hierarchical
  model of salmon lice at individual farms from cage-level data on 32 Norwegian farms
  (stocked 2011-2013, slaughtered 2012-2014). Twelve farms sit just north of Frøya.
  The seaway-distance kernel is taken from Aldrin et al. (2013). Internal recruitment
  averaged 25 percent of recruitment (interval 23-26 percent) and mattered more on
  farms with high adult-female abundance and few neighbours. Held-out months matched
  observations reasonably well. The paper is a farm lice population model, not a coastal-planning
  study.

  '
