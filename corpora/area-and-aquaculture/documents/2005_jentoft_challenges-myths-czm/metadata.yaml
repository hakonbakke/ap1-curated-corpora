key_claims:
- Coastal-zone management must handle diversity, complexity, dynamics and risk. Managers often postpone hard decisions and rationalise non-decision with three myths.
- Myth 1 is that space is unlimited. The coastline is stated as 83 000 km. From the air pens look like a few dots. On the ground the zone is crowded. Security zones and alternative locations make aquaculture space-consuming. New uses are often assumed to be addable. When areas are taken, development can become zero-sum.
- Myth 2 is that spatial delimitation is all that coastal-zone planning requires. The Planning and Building Act of 1985 makes demarcation the primary instrument. Boundaries do not replace conflict-resolution institutions or cooperative links between fisheries, aquaculture and tourism.
- Myth 3 is that coastal culture always self-heals. Small-scale fisheries depend on community knowledge and moral standards that are not self-sustaining and sit outside the usual fisheries-authority toolbox.
- Government required a coastal-zone plan as a condition for new fish-farming licences. Many municipalities produced documents quickly. Quality was such that many soon had to be revised. Aquaculture demand often outran the plans.
- The authors argue that a more realistic ambition is risk-management, avoiding worst-case scenarios, rather than aiming for some positively defined ideal state of the coastal zone.
claims_about_uncertainty:
- The four features (diversity, complexity, dynamics, risk) are presented as inherent, not as quantified scores.
- Science cannot always be trusted on risk. Oil-shipping from Kola is used as a feared analog to the Prestige spill, not as a measured probability.
claims_about_policy_or_management:
- Simple standard fixes fit for all situations are not available. Management systems should be diverse, complex and dynamic enough for the case.
- Sector management of fisheries and aquaculture is not targeted at creating territorial symbioses.
methodological_limitations:
- Conceptual essay. No independent measurement of occupation or of how often the three myths appear in named plans.
rag_summary: >
  Jentoft and Buanes (2005) argue that Norwegian coastal-zone management faces
  diversity, complexity, dynamics and risk, and that managers often postpone hard
  choices by invoking three myths: space is unlimited, spatial delimitation is all
  it takes, and coastal culture takes care of itself. The coastline looks empty from
  the air. On the ground, aquaculture security zones make the industry space-consuming
  and new uses can become zero-sum. The 1985 Planning and Building Act makes
  demarcation the main tool, which they say is not enough. They prefer avoiding
  worst cases to planning an ideal coast. This is an essay, not a new occupancy census.
