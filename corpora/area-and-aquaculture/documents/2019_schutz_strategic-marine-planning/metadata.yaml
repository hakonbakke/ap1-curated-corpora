key_claims:
- The paper compares Norway and Scotland on aquaculture and offshore wind through strategic plans, marine spatial planning and licensing, asking how predictability and adaptability are balanced.
- Both jurisdictions use a patchwork of national, regional and local competences plus licences. One-size-fits-all policies are judged ineffective because the sectors grew in different policy frames. The two countries nonetheless took parallel approaches to aquaculture and to offshore energy.
- Norwegian aquaculture is described as inshore. Production areas are said to raise predictability for farmers, while what will be decisive in a given case can remain unpredictable.
- Municipal land-use planning under the Planning and Building Act coordinates aquaculture with other uses. Integrated large-ecosystem management plans in Norway are described as lacking the same legal binding force as some Scottish instruments.
- Licensing can be clearly worded (predictability) and still use open tests such as significant effects (adaptability, and sometimes unpredictability). System change in mature aquaculture is slow and grounded in statute, which the authors treat as broader predictability.
claims_about_uncertainty:
- No wind farms were under construction in Norway at the time of writing. Scottish project delivery also depended on factors beyond MSP, including the Crown Estate lease role.
claims_about_policy_or_management:
- Multi-use feasibility is described as project-dependent. Norwegian land-use planning already has dispensation traces.
methodological_limitations:
- Functional legal comparison, not an empirical siting census. Supplementary appendix not in this extract.
rag_summary: >
  Schutz and Slater (2019) compare Norwegian and Scottish governance of
  aquaculture and offshore wind through strategic plans, marine spatial planning
  and licensing. They ask how legal systems keep investment predictable while
  staying adaptable. Aquaculture is the mature inshore sector. Offshore wind is
  the emerging one. Both countries use a multi-level patchwork. Production
  areas and municipal plans raise predictability in Norway, while open licence
  tests and non-binding ocean management plans leave room to adapt. This is a
  legal review, not a new occupancy study.
