curator_note: 'Full walk 2026-09-13. No page markers. Walked sammendrag, chapters
  1 to 8, and annexes 1 to 5 by heading. No named individual authors. No DOI. Version
  3.0 dated 09.11.23. The phrase 34 033 mrd. kr on the summary page conflicts with
  Table 1 (mill.kr) and with figure parts that sum to about 34 billion NOK. File the
  table unit. Distinguish Table 6 annual sum 6 684 million (includes kelp and ripple)
  from the 3 939 million that enter NPV. Hersoug and Johnsen (2012) are cited for
  conflicting coastal uses. NOU 2023:23 is a normative source, not a file in this
  room.

