key_claims:
- This is a stochastic simulation of lice on historic production in production area
  PA3 (Bjørnafjorden and Hardangerfjorden), not a coastal-plan or licensing study.
  The authors' own keywords include spatial planning. The analysis remains a lice-network
  model.
- PA3 is stated as 3646 km2 with 147 active salmonid farms in January 2014 to December
  2017. Average standing stock in PA3 farms was 544 000 fish (5-95 percent 64 000
  to 1 084 000). National background in the introduction includes a monthly average
  standing stock of 713 000 fish per farm in 2014-2017 and a farmed-to-wild host
  ratio cited from Dempster et al. (2021).
- 'The lice model is Aldrin et al. (2019), run on weekly steps after a 16-week spin-up.
  The historical downward-trend parameter from that fit was set to zero. Biomass from
  closed farms is moved to remaining farms with matching cohorts so total host biomass
  is held constant. Nine scenarios: baseline, random removal of 20-50 percent of farms
  (10 random draws each, 10 000 simulations), and strategic removal of the most connected
  farms (Huserbråten connectivity network, 1000 simulations each). Total stated as
  45 000 simulations.'
- 'Closing farms and relocating biomass reduced simulated adult-female lice by 4-15
  percent, other motile lice by 6-23 percent, and annual fish treatments by 6-25
  percent versus baseline. Strategic removal outperformed random removal. The strongest
  stated case is strategic removal of 50 percent of farms: median cuts of 15 percent
  adult females, 23 percent other motiles, and 25 percent treatments. Random-removal
  treatments fell by 6-17 percent. Strategic-removal treatments fell by 14-25 percent.'
- The authors say fewer, larger, more distant farms can fragment the lice transmission
  network. They also say the methods are not a straightforward procedure to optimise
  farm structure in the study area. Adult-female reductions look smaller because
  treatment is triggered by adult-female counts.
claims_about_uncertainty:
- Some redistributed farms exceed 5 million fish, with a maximum of 18.2 million.
  Those sizes lie outside the data used to fit the model.
- Treatment in the model cuts lice by 75 percent the week after the threshold is crossed.
  Aldrin et al. (2019) estimated 44-47 percent. The authors chose a value closer to
  azamethiphos in Aldrin et al. (2017).
- The simulation does not test whether remaining sites can hold the extra biomass,
  or whether wellboats and equipment would be available. Background infestation from
  wild sources remains.
- The seaway-distance lice simulator and the hydrodynamic targeting list are not the
  same network. The authors argue that strategic removal still beats random removal
  across that mismatch.
claims_about_policy_or_management:
- 'Core mechanisms named for regional production planning and allocation of production
  concessions: host density, between-farm distance, and removal of highly connected
  farms as firebreaks.'
- 'Lice legislation cited: 0.2 adult females per fish in spring smolt migration (weeks
  16-21), 0.5 otherwise. Traffic-light regulation of intensity by production area
  is background, not the object of the simulation.'
- Marine production cycle is described as 14-19 months, one generation per cycle,
  then about 2 months fallowing.
methodological_limitations:
- Simulation on one production area and one historic period. Qualitative direction
  is what the authors stand behind, not a ready siting recipe.
- Seaway-distance lice model and hydrodynamic connectivity network are not the same.
  The authors argue that strategic removal still beats random removal across that
  mismatch.
- Farm sizes in the 50 percent scenarios are far outside the fitted range.
rag_summary: 'Qviller and colleagues (2024) simulate salmon-lice dynamics in Norwegian
  production area PA3 after moving the same farmed biomass onto fewer, larger farms.
  They use the Aldrin et al. (2019) lice model on 2014-2017 production data. Random
  or strategic farm closures reduce simulated lice and treatments. Strategic removal
  of the most connected farms does more. The largest scenario (50 percent of farms
  closed) is also the least realistic on farm size. This is a lice-network model,
  adjacent to area questions, not a municipal siting or licensing paper.

  '
