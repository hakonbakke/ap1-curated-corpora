key_claims:
- 'Of 157 municipalities with sea localities for salmon or trout, 65 were in inter-municipal coastal-zone planning, across six projects in Troms, Nordland, Sør-Trøndelag, Møre og Romsdal and Hordaland.'
- 'A farmer survey found planning conflicts with conservation interests (57 percent), fisheries (54 percent), wild salmon (36 percent), sea transport (22 percent), tourism (19 percent) and other farmers (11 percent).'
- '93 percent of responding firms had taken part in a plan process in the previous six years. Time spent was on average more than one week and less than one month.'
- 'The processes improved competence, shared data and routines, and a wider view of the sea area. Final designation stayed with each municipal council, so piece-by-piece management remained.'
- 'The authors cannot say whether inter-municipal planning is a better tool for site access. Some processes took four to five years. Fensfjorden designated no new aquaculture areas. Nord-Troms cleared ten new aquaculture areas. Farmers report refusals even for applications aimed at areas already zoned for aquaculture.'
- 'National databases cover nature, traffic and pollution. The projects received little corresponding fact base from the firms on local economic effects. Nature Diversity Act sections 8 to 10 are named as the knowledge, precaution and cumulative-load duties in planning.'
rag_summary: 'Robertsen, Kvalvik, Andreassen, Hersoug and Johnsen (Nofima report 27/2014) ask whether inter-municipal coastal-zone planning is a better tool for access to aquaculture sites. Methods are document review, interviews with project leaders, a farmer survey and six cases: Kysten er klar, Troms, Helgeland, Romsdalsfjorden, Nordmøre and Fensfjorden. Most coastal plans exist, but many are old and still show aquaculture areas that are no longer usable. Sixty-five of 157 host municipalities were in such projects. Firms take part, and report conflicts most often with conservation and fisheries. The processes build shared data and competence. They do not move the final decision off the individual municipality, and continuity after the project ends is weak. The authors give no single answer on whether the tool improves site access. Several farmers report refusals even inside areas already zoned for aquaculture.'
included_because: 'Selected by Marit Schei Olsen. The report is the empirical account of the first wave of inter-municipal coastal plans and of whether they improve site access.'
quality_signal: medium
quality_rationale: 'Open Nofima report with named cases and a farmer survey. The survey response rate is stated as nearly 50 percent of 111 firms (54 replies). Several projects were unfinished when the report was written, and the authors say a firm conclusion on site access would be early.'
relevance_signal: high
relevance_rationale: 'Directly about municipal and inter-municipal designation of sea area for aquaculture, the knowledge base of those plans, and conflicts with other users.'
