key_claims:
- 'Nofima report 11/2025 (12 February 2025) from the CLEAN project. Two tasks: map
  legal and plan requirements for cumulative-impact assessment in five northern cases,
  and report a 2024 survey of practice.'
- 'Cases are Svalbard, the Barents Sea and Lofoten waters, Nord-Norge coastal and fjord
  areas, terrestrial Nord-Norge, and the Pasvik watercourse. The authors distinguish
  two meanings of cumulative impact: several stressors on one nature object, and one
  activity (for example aquaculture) with many pressures.'
- Naturmangfoldloven section 10 and the impact-assessment regulation require cumulative
  load or combined effects. Those rules are guidelines. A missing section 7 assessment
  can be a procedural error (Sivilombudet). Many sector laws do not say cumulative.
  Of 18 laws and regulations scored, 6 use cumulative-impact or ecosystem-based language.
  Another 6 use looser terms such as holistic or sustainable.
- The Aquaculture Act requires environmentally sound production and holistic weighing
  of area needs and interests, inside and outside aquaculture. The authors say it has
  no explicit requirement to assess cumulative impact. For the coast they conclude
  that planning and water law are the clearer cumulative instruments, and that aquaculture
  has implicit holistic duties without practical guidance.
- Aquaculture is used as an example of one activity with many pressures (nutrients,
  lice, escapees, lice medicines, light, sound), citing Evenset et al. (2023). A single
  new farm is treated as an extra load on already used water, not as a stand-alone
  case.
- Barents Sea management plans are described as holistic and ecosystem-based, but
  not legally binding. Sectors remain free to interpret their own contribution. Nature
  Diversity Act applies only in part beyond 12 nautical miles.
- Svalbard environmental law section 8 is the only provision the Svalbard chapter
  calls an explicit cumulative-load rule in that case. Nature Diversity Act chapter
  II does not apply on Svalbard. The Svalbard environmental law was amended from 1
  January 2025 to limit traffic pressure.
- 'Survey: 370 persons contacted in November 2024, 76 respondents (state 33, municipality
  27, county 8, consultants 8). 46 percent said they assess cumulative impact to a
  large or very large degree (45 percent in the closing chapter). Including medium
  answers gives 78 percent.'
- Respondents split between single-project and multi-activity cumulative assessment.
  Most used discretion for stressor interactions (72 percent on the last case). 58
  percent said they use guides for cumulative assessment. 63 percent reported medium,
  low, or very little knowledge of how stressors interact. Data gaps were more often
  a medium or smaller problem than interaction-knowledge gaps.
claims_about_uncertainty:
- The survey chapter is a rough overview. The authors say more analysis and interviews
  will follow in CLEAN.
- How discretion is used, and how the precautionary principle (Nature Diversity Act
  section 9) is applied, is not studied here.
- Figures 6-17 hold the detailed distributions. Several percentages in the closing
  chapter are stated without reprinting the full tables. Filled legal-coding sheets
  are available from the authors, not in this extract.
- The closing chapter uses 45 percent for large or very large assessment. Chapter
  4 uses 46 percent. Both are filed.
claims_about_policy_or_management:
- Cross-cutting law (nature diversity, impact assessment) often pulls sector decisions
  back toward a cumulative duty even when the sector act is silent.
- Almost all management plans reviewed mention cumulative assessment or ecosystem-based
  management. None of the cases give concrete method requirements.
- Water-management scoring uses a one-out-all-out rule and does not model stressor
  interaction. The water regulation gives no extra order or incentive power. Sector
  authorities and municipalities decide measures inside their own budgets.
- Norwegian KU practice investigates environment and society together. Evaluations
  cited (Multiconsult 2021, Pedersen et al. 2019) say economic and social themes often
  dominate, with weak environment chapters.
methodological_limitations:
- Legal mapping used project experts, a shared table, and a workshop. Some formally
  applicable laws were dropped as low practical relevance. Appendix Table 4 is the
  English coding template. Filled sheets are not in the extract.
- Survey went to lowest-level managers with a request to forward. Not a probability
  sample of all practitioners. Personal-data handling was assessed by Sikt (reference
  501313).
- 36 pages plus one appendix page. Practice results are high-level.
rag_summary: 'Mikkelsen and colleagues (Nofima 11/2025) map how cumulative environmental
  impact is required and practised in northern Norway. Five cases include Nord-Norge
  coasts and fjords. Nature-diversity law and the impact-assessment regulation require
  cumulative assessment. The Aquaculture Act does not say so explicitly, though it
  requires environmentally sound and holistic area judgements. A 2024 survey (76 of
  370) finds widespread but often discretionary practice and weak knowledge of stressor
  interactions. This is a management-and-law report, not a farm-density or siting
  model.

  '
