key_claims:
- The paper studies five generations of Tromso coastal-zone plans over 35 years and asks how government frames the need for integration and how that framing changes.
- Integration is fluid. Previous spatial dispositions become later problems. Ambitions for comprehensive planning can obscure purpose and increase complexity.
- Vocabulary shifted from coordination (2000, 2008) to comprehensiveness and integration (2015) and almost solely comprehensive in 2022. Plan descriptions grew. The 2015 description was twice the 2000 plan. The 2022 plan was triple. Later plans are more standardised.
- Tourism and recreation moved conflict lines closer to land. The Water Regulation (to one nautical mile from the baseline) was added as an integration tool and as a new coordination demand.
- Paradox of integration: seeing more things in unison does not necessarily reduce complexity. Comprehensiveness is called intuitively positive but hollow. Failure to hinder spatial conflicts becomes an argument for yet more comprehensiveness, not a test of whether integration is the right ambition.
claims_about_uncertainty:
- The paper does not measure whether thicker plans reduced user conflict.
claims_about_policy_or_management:
- Coordination and cooperation are described as more precise terms than comprehensiveness. Integration can be co-opted by vested interests.
methodological_limitations:
- Governmentality reading of one region's plan series. Competing-interest statement uses singular author.
rag_summary: >
  Sørdahl and Kvalvik (2024) read five generations of Tromso coastal-zone plans
  (1991-2022). Integration is not a fixed tool. Plans grew thicker, more
  comprehensive and more standardised, while vocabulary shifted from
  coordination to comprehensiveness. The authors argue that treating
  integration as the undisputed answer to coastal conflict makes failure into
  a reason for yet more integration. Comprehensiveness is described as a
  positive but hollow term. This is a document study, not a test of whether
  thicker plans reduced conflict.
