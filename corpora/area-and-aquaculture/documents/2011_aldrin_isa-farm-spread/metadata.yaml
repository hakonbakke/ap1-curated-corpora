key_claims:
- The paper models the rate of ISA infection of Norwegian salmon farms as a function
  of seaway distance to infectious neighbourhood farms, genetic distance between ISAV
  isolates, cohort size, and a constant other-pathway term. Journal of the Royal Society
  Interface 8 (2011) 1346-1356.
- Data cover all 1201 marine farms with Atlantic salmon in any month from February
  2003 to August 2009, 3202 cohorts, and 72 recorded ISA diagnoses (63 from 2004 onward).
  The 63 diagnoses from 2004 to August 2009 are the events in the partial likelihood.
  Four of those 63 had unknown genotypes. The haemagglutinin-esterase gene was sequenced
  from all but six infected farms.
- Seaway distances were the shortest path over seawater, truncated at 100 km. Farms
  had between 0 and 27 other farms within 10 km seaway (median 5). Six percent of
  isolate pairs had genetic distance 0, 6 percent distance 1, 7 percent distance 2,
  and 81 percent distances 3 to 384.
- Both seaway and genetic distances were significantly associated with the infection
  rate. Estimated seaway parameter f was 0.095 (interval 0.046-0.145), implying about
  a 60 percent drop in risk from a neighbourhood farm when distance rises from 0 to
  10 km. Genetic-distance parameter v was 1.42 (0.40-2.45), implying about a 75 percent
  drop when genetic distance rises from 0 to 1.
- About 43 percent of ISA infections in January 2004 to August 2009 are attributed
  to neighbourhood infectious farms (Table 1 interval 40-64 percent). Without genes
  the neighbourhood share is 47 percent (43-62). The rest are attributed to other,
  non-specified sources. Genetic information changed the overall neighbourhood share
  only slightly but sharpened farm-level source probabilities toward 0 or 1.
- The 2004-2007 neighbourhood share in the earlier Aldrin et al. fit (no genes) was
  22 percent (21-37). The authors say the later rise is driven by the Troms cluster
  after June 2007.
- In the Troms cluster after June 2007 the model traces spread from one farm (ISA
  recorded June 2007) to 16 others within two years. Isolates from 15 of the 17 farms
  had identical genotypes. The remaining two had genetic distance 1 to the others.
- Some model pathways with probability above 0.9 exceed 20 km seaway, and one southern
  example is about 30 km (probability 0.87). For the three pairs beyond 20 km, follow-up
  found no shared ownership or smolt source. Two pairs had shared a well boat and
  a dive team. The authors note that 5 km and 10 km are the Norwegian Food Safety
  Authority restriction and observation zone radii.
- Stocking category was not significant. Susceptibility rose with cohort size. Infectiousness
  was marginally non-significant in the full model (p-value 0.06). Ten of 63 infection
  times were set equal to stocking because of the six-month delay rule. Eight of those
  ten were relocated cohorts.
claims_about_uncertainty:
- Infection time is unobserved. The main fit assumes a fixed six-month delay. Refits
  with 1, 2, 3 or 9 months gave similar results.
- About half of infected farms have unknown sources. Other pathways may include well
  boats, infected smolts, undetected infectious farms, or a reservoir of non-virulent
  ISAV.
- The authors say seaway distance should later be replaced by a directional current-based
  measure. That information was then available only for limited stretches of the coast.
- Cohorts with two genotypes are handled by using the smallest inter-farm genetic
  distance. The model allows only one infection event per cohort.
- The discussion once says nearly half of infections from January 2003 to August 2009.
  The 43 percent figure and Table 1 use January 2004 to August 2009. That date slip
  is the paper's own wording, not resolved here.
claims_about_policy_or_management:
- The authors argue that neighbourhood ISAV risk extends well beyond the 5 km and
  10 km control zones then in force.
- They suggest more efficient control by intensifying ISAV surveillance around infected
  farms, with surroundings extended to 20-30 km, and by early removal of infectious
  fish.
methodological_limitations:
- Partial-likelihood stochastic model. Diagnosis date is recorded. Infection date
  is assumed.
- Infectiousness is constant from the assumed infection time until the cohort is removed.
- Cohort movements could not be traced. Relocated cohorts are a separate stocking
  category.
- No coastal-zone plan, municipal designation, or site-licensing analysis.
rag_summary: 'Aldrin et al. (2011) fit a stochastic infection-rate model for infectious
  salmon anaemia among Norwegian marine salmon farms. Inputs are seaway distances,
  genetic distances between ISAV isolates, and farm and cohort data for 1201 farms
  from 2003 to summer 2009. Both seaway and genetic distance were associated with
  infection rate. The fitted model attributes about 43 percent of infections in 2004-2009
  to neighbourhood farms. Risk from a neighbourhood farm fell by about 60 percent
  when seaway distance rose from 0 to 10 km. The paper is farm-to-farm ISA epidemiology.
  It is not a coastal-planning or site-access study.

  '
