key_claims:
- Meld. St. 35 (2023-2024) is Norway's biodiversity action plan following the December 2022 global nature agreement. It covers sustainable use and conservation on land and at sea.
- Area change on land and at sea is named as the largest negative driver of nature loss in Norway. The sum of small actions can exceed what nature can tolerate.
- Tools emphasised include a nature account, menus of ecosystem measures, a target to reduce development of especially important nature areas, and principles for sustainable area management. The 30 percent area goal is named.
- Fisheries, catch and aquaculture are presented as food and value creation that depend on functioning ecosystems. A main aquaculture-management goal is greatest possible value creation within sustainable frames. NOU 2023:23 is cited for later follow-up in an aquaculture white paper.
- Municipal plans with impact assessment are described as important for locating aquaculture and for use versus protection. The government wants better coastal-zone planning guidance.
- The traffic-light system has one indicator, lice-induced mortality of out-migrating salmon smolts, and 13 production areas. An expert group found that traffic-light thresholds and the quality standard for wild salmon do not steer toward the same goal. Sea trout is intended in colouring from 2026. Cod farming in spawning areas and fields was clarified as prohibited in 2024.
claims_about_uncertainty:
- The paper says it does not present all measures or all answers. Intentions for a later aquaculture white paper are not results.
claims_about_policy_or_management:
- Nationwide area management already exists through the Planning and Building Act, ocean and water plans, and the Nature Diversity Act beside sector laws.
methodological_limitations:
- Government white paper. Figures and most land chapters unread in this pass.
rag_summary: >
  Meld. St. 35 (2023-2024) is the Norwegian government's nature-diversity action
  plan for land and sea. Area change is named as the largest driver of nature
  loss. Aquaculture is one food-and-value sector that must stay inside
  sustainable frames. Municipal plans locate sites. The traffic-light system's
  lice indicator is stated not to match the wild-salmon quality standard. This
  is policy, not a new empirical occupancy study. This curation walked the
  summary, sea/coast status, the fisheries-aquaculture sector and the
  aquaculture area subsection.
