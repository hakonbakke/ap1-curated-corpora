key_claims:
- Four intermunicipal coastal plans ran in Troms in 2013-2016 (22 of 23 coastal municipalities).
  This paper codes strategic environmental assessments (SEAs) of 143 proposed aquaculture
  areas in the two largest processes (18 municipalities), Mid and South Troms, and
  the Tromsø region.
- Municipalities are planning authority for nearshore sea (within 1 nautical mile from
  the baselines). The Aquaculture Act says site licences may not be granted against
  an adopted plan unless the planning authority consents. The municipal council makes
  the final plan decision. A later site licence still needs sector permissions (pollution,
  food safety, marine traffic). The authors cite that environmental impact assessments
  at the licence stage are rarely made.
- 'Mid and South Troms: 13 municipalities, about 3800 km2 sea, about 55 000 people,
  70 000 tonnes salmon (about half of county production), 85 approved localities (61
  salmon). 109 proposed aquaculture areas (101 salmon: 41 new, 60 expansions). Municipal
  planners scored 22 themes. The SEA recommended 89 allow and 20 disallow. Politicians
  later turned down 8 SEA recommendations and allowed 5 areas the SEA had not recommended.'
- 'Tromsø region: 5 municipalities, about 5100 km2 sea, about 88 000 people, 22 approved
  salmon localities. 34 proposed areas (33 salmon: 31 new, 2 expansions). One consultant
  scored five themes (plus verbal-only themes). Jobs or income were not an explicit
  scored theme. The SEA recommended 15 allow and 19 disallow. Politicians later turned
  down 4 recommendations and allowed 4 areas the SEA had not recommended.'
- Both SEAs list similar external data sources (46 listings in Mid and South Troms,
  51 in the Tromsø region). National databases are listed most often, usually only
  by name, not the exact dataset. Mid and South Troms listed public meetings or stakeholder
  input twice as often. Most value and impact scores rest on discretionary judgement.
  In Mid and South Troms only six of 22 themes had a clearly stated value-score rule,
  and only two themes had clear rules for both value and impact. Neither SEA states
  general criteria for recommend or not recommend.
- Probit models suggest Tromsø-region SEA recommendations tracked the sum of consequence
  scores more consistently than Mid and South Troms, where extreme theme scores fit
  better. Political decisions went against 24 percent of Tromsø recommendations and
  12 percent of Mid and South Troms recommendations. Some models did not converge.
  The authors note that theme scores may not be comparable across themes.
- Verbal summaries often understated negative scores. In Mid and South Troms, 108 of
  110 summaries had discrepancies (mean 4.3, highest 13). Ninety percent of those
  discrepancies made consequences look less negative. The theme most often misstated
  was stocks of anadromous salmonids (65 percent of summaries), then spawning areas
  (38 percent) and landscape (35 percent). In the Tromsø region, 19 of 34 summaries
  had discrepancies (mean 0.8, highest 2), and all of them made consequences look
  less negative (landscape 24 percent, nature diversity and cultural heritage 21 percent
  each).
- The authors treat SEAs as value-laden, not only technical. More explicit trade-off
  rules would raise transparency and could raise consistency, but rigid standardisation
  can miss local context. Verbal summaries should be quality-assured. Municipal self-rule
  is described as recently strengthened (Constitution 2016, Municipalities Act 2020),
  so shifting national and regional trade-offs away from municipalities is judged unlikely.
claims_about_uncertainty:
- The authors cannot tell from the data whether local politicians influenced Mid and
  South Troms recommendations.
- They did not interview planners about whether inferred decision rules were used
  consciously. Some probit models did not converge. Supplementary tables are cited
  but not in the extract.
- If only large theme scores drive decisions, small consequences that add up across
  many areas may be ignored. If the sum of scores drives decisions, a single theme
  of very large importance may not trump the rest.
- Participation in SEA processes was not studied. Interviews inform context and are
  not used as coded data.
claims_about_policy_or_management:
- Being more explicit about trade-off rules would raise transparency and could raise
  consistency, but rigid standardisation can miss local context.
- Verbal summaries should be quality-assured because politicians and the public often
  rely on them.
- Municipal self-rule is described as recently strengthened, so shifting national
  and regional trade-offs away from municipalities is judged unlikely.
- Formal objections from sector agencies must be resolved before a plan can be passed.
  If parties cannot agree, the Ministry of Local Government and Modernisation decides.
methodological_limitations:
- Two cases in one county. Interviews used for context, not as coded data. Participation
  in SEA processes was not studied. Theme scores across themes may not be comparable.
- Mid and South Troms is described as a nationally cited good example. The Tromsø
  consultant model is described as common. Neither claim is a national census of SEA
  practice.
- Some probit models had few observations relative to variables, omitted themes that
  predicted outcomes perfectly, or did not converge.
rag_summary: 'Mikkelsen, Sørdahl and Solås (2022) analyse transparency and consistency
  of strategic environmental assessments in two Troms inter-municipal coastal plans
  covering 143 proposed aquaculture areas. Methods are document coding of knowledge
  sources and scoring rules, probit models of recommend or allow decisions, and comparison
  of verbal summaries with theme scores. They find similar external data lists, heavy
  use of discretion, no stated general decision rule, more consistent Tromsø-region
  recommendations (one consultant, sum of scores) than Mid and South Troms (13 municipal
  planners, extreme scores), and widespread positive bias in verbal summaries, especially
  on wild salmon. Political councils overturned some recommendations in both processes
  (24 percent in the Tromsø region, 12 percent in Mid and South Troms). The paper
  treats SEAs as value-laden, not only technical.

  '
