key_claims:
- 'SINTEF report 2025:00943, version 1.1, dated 31 October 2025, 52 pages plus five
  sector annexes. Client: Trøndelag County Municipality. ISBN 978-82-14-07302-7.'
- The five bio-based industries are fisheries, aquaculture, agriculture, forestry
  and reindeer husbandry. The aim is a knowledge base for industrial policy so these
  industries keep necessary production area.
- Trøndelag is given as about 42 200 km2 land, 10 860 km2 sea inside the baselines
  (16 percent of the national figure), and about 15 200 km2 sea out to the territorial
  limit. About 487 000 inhabitants (1.1.2025). Regional value creation 268 billion
  kroner in 2022 (latest county national accounts).
- Table 1 estimates the five industries plus processing and other ripples at 40.1
  billion kroner, or 15.0 percent of regional value creation, and 34 480 jobs (13.6
  percent of employment). Aquaculture is the largest value-creation sector in that
  table (18.2 billion kroner, 11 400 jobs). Agriculture is the largest employer (14
  700 jobs, 13.6 billion kroner). The section 3.2 aquaculture digest instead uses
  about 16 billion kroner, which is the companion delrapport chapter 7 figure.
- Table 2 states today's area pattern as intensive exclusive aquaculture on 0.5 percent
  (50 km2) of the coastal zone, intensive exclusive agriculture on 4 percent (1 630
  km2) of land, forestry on about 9 percent (3 600 km2), reindeer extensive use on
  about 70 percent of land, and fisheries extensive use of almost all sea area.
- Informants in every sector worry about future production-area access, mainly against
  other land- and sea-demanding public purposes. On land the largest conflicts over
  productive bio-industry area are said to come from outside the five sectors. At
  sea the same pattern includes petroleum, energy, shipping, tourism and nature. In
  addition, fisheries and aquaculture disagree on how precautionary one should be
  about aquaculture's effect on marine ecosystems that fisheries depend on.
- Chapter 4 states that regional aquaculture growth is stopped first by environmental
  and fish-health problems in today's systems, not by a shortage of area for pens
  or regional feed. The authors repeat the companion figure that about 20 percent
  of sea in production areas 6 and 7 is occupied once sanitary distances are included
  (Skrove et al. 2023).
- 'Table 4 growth ambitions named by informants: agriculture about 20 percent more
  food, forestry double harvest in Trøndelag, aquaculture a fivefold national production
  aim, fisheries maintain or slightly increase, reindeer maintain today''s level.'
- The authors propose building area work on the county bioeconomy coordination group,
  if all five industries are represented. Reindeer husbandry is named as missing from
  that group. They warn against placing working bio-production in the same rhetorical
  box as permanently lost built nature. Chapter 5.5 treats social licence, including
  Osen as a lice and disease buffer with little compensation.
claims_about_uncertainty:
- SINTEF says there was no established method for this cross-sector assignment. The
  group added its own time beyond the funded contract. Informants disagreed strongly
  on themes and tone.
- Prior descriptions of production-area suitability, beyond measured area and biological
  productivity, are called highly uneven across sectors. Regional maps of core production
  area were hard to draw.
- Table 1 figures are estimates aligned toward 2023. The authors say they should be
  revisited if higher precision is needed.
- Knowledge about how the five industries affect ecosystems, and therefore each other,
  is called incomplete. Fisheries and aquaculture share a precaution disagreement
  while knowledge is still thin.
claims_about_policy_or_management:
- Future area need is placed at the junction of today's cost-efficient linear systems
  and impulses from the green shift, circular economy, nature, geopolitics and food
  security.
- County tools discussed include Regional plan for arealbruk 2022-2030 (including
  guideline R28 on sea area for aquaculture through inter-municipal processes) and
  the bioeconomy coordination group. Consultation with Sámi interests is described
  as legally strengthened but practised very unevenly.
- Social licence for bio-based production is a closing chapter theme. Justice among
  groups affected by each other's area use is named as unfinished work.
methodological_limitations:
- New analytical frame. Sector notes of about 18 to 33 pages sit in annexes. Main-report
  aquaculture numbers mix a short digest of the companion delrapport with Table 1
  estimates. Not an independent farm census.
- Outside-sector conflict views rest on earlier research, not new interviews with
  those opponents.
- Annexes 1 to 5 are listed but not reproduced in this extract.
rag_summary: 'SINTEF report 2025:00943 for Trøndelag County Municipality (31 October
  2025). Sand, Haugset, Misund and Sønvisen map area use, need and conflict for fisheries,
  aquaculture, agriculture, forestry and reindeer husbandry. The five industries are
  estimated at 15 percent of regional value creation (40.1 billion kroner). Informants
  fear losing production area to other public purposes. At sea, fisheries and aquaculture
  disagree on how precautionary to be about ecosystem effects. Table 2 gives aquaculture
  0.5 percent (50 km2) of the coastal zone as exclusive intensive use. Chapter 4 says
  aquaculture growth is constrained first by lice, disease and welfare, not by missing
  pen area. Aquaculture detail is delegated to the companion delrapport. The method
  is new and the authors mark informant disagreement.

  '
